claims:
  - claim_id: clarity_preserves_adaptive_system_data
    statement: >
      Clarity preserves pre-financial adaptive-system signals by mapping process
      structure before filtering impacts through corporate materiality or
      monetized value.
    supported_by:
      - clarity_vs_kpmg_tvf
    related_concepts:
      - adaptive_system_data
      - corporate_materiality
      - system_coherence
      - pre_financial_analysis
    status: active

  - claim_id: kpmg_monetizes_externalities
    statement: >
      KPMG True Value is strongest when identified economic, social, and
      environmental externalities can be bounded and translated into financial
      terms.
    supported_by:
      - clarity_vs_kpmg_tvf
    related_concepts:
      - externalities
      - monetization
      - corporate_reporting
      - value_chain
    status: active

  - claim_id: corporate_materiality_can_filter_system_signals
    statement: >
      Corporate materiality boundaries can filter out weak adaptive-system
      signals before those signals become visible as financial, ESG, or
      reporting concerns.
    supported_by:
      - clarity_vs_kpmg_tvf
    related_concepts:
      - corporate_materiality
      - weak_signals
      - adaptive_system_data
      - esg
    status: active

  - claim_id: ndc_models_phase_coherence
    statement: >
      The N-D-C framework models phase coherence by distinguishing Definition
      constraints from Contribution outputs and treating Negotiation as the
      emergent stable phase state.
    supported_by:
      - tholonic_framework_supply_value_chain
    related_concepts:
      - ndc
      - phase_coherence
      - negotiation
      - definition
      - contribution
    status: active

  - claim_id: definition_contribution_balance_drives_negotiation
    statement: >
      Balance between Definition and Contribution is the primary condition that
      determines whether a stable Negotiation state can emerge at a given
      system level.
    supported_by:
      - tholonic_framework_supply_value_chain
    related_concepts:
      - definition
      - contribution
      - negotiation
      - balance
      - tholonic
    status: active

  - claim_id: ndc_can_be_calculated_from_definition_and_contribution
    statement: >
      N-D-C implementation can calculate phase health from measurable Definition
      and Contribution inputs, while treating Negotiation as the resulting
      coherent state.
    supported_by:
      - tholonic_integration
    related_concepts:
      - ndc
      - calculation
      - phase_health
      - implementation
    status: active

  - claim_id: physical_flow_precedes_value_interpretation
    statement: >
      Physical supply-chain flow, custody, constraints, and measurable outputs
      must be mapped before value-chain or financial interpretation is added.
    supported_by:
      - supply_chain_rules
    related_concepts:
      - supply_chain
      - custody
      - physical_flow
      - separation_of_concerns
    status: active

  - claim_id: value_layer_must_not_be_mixed_with_physical_supply_chain
    statement: >
      Pricing, margins, value capture, and financial interpretation belong to a
      value-chain layer that must remain analytically separate from the physical
      supply-chain layer.
    supported_by:
      - value_chain_rules
    related_concepts:
      - value_chain
      - pricing
      - margins
      - separation_of_concerns
    status: active

  - claim_id: phase_must_have_physical_state_transformation_output
    statement: >
      A supply-chain phase is valid only when it has a defined physical state,
      a transformation or custody change, and a measurable output.
    supported_by:
      - abstract_supply_chain_phase_template
    related_concepts:
      - supply_chain
      - phase_mapping
      - physical_state
      - measurable_output
    status: active

  - claim_id: value_chain_aligns_to_supply_chain_by_phase_id
    statement: >
      Value-chain records should align to supply-chain phases by phase id, while
      preserving a strict analytical distinction between physical flow and value
      interpretation.
    supported_by:
      - abstract_value_chain_phase_template
    related_concepts:
      - value_chain
      - supply_chain
      - phase_id
      - separation_of_concerns
    status: active

  - claim_id: tholonic_structure_is_grounded_in_first_principles
    statement: >
      The Tholonic structure is treated as mathematically grounded in recursive
      first-principles relationships among N, D, and C, not merely as a
      descriptive metaphor.
    supported_by:
      - tvpci_foundation
    related_concepts:
      - tholonic
      - first_principles
      - ndc
      - mathematics
      - constants
    status: active

  - claim_id: five_constants_provide_coherence_reference_points
    statement: >
      Mathematical constants such as pi, phi, sqrt(2), e, and ln(2) provide
      reference points for interpreting coherence and convergence in the TVPCI
      framework.
    supported_by:
      - tvpci_explained_math
    related_concepts:
      - tvpci
      - constants
      - coherence
      - convergence
    status: active

  - claim_id: pricing_convergence_can_be_evaluated_against_tholonic_balance
    statement: >
      True value pricing convergence can be evaluated against Tholonic balance
      conditions rather than treated only as a conventional market-price
      comparison.
    supported_by:
      - tvpci_specification
    related_concepts:
      - tvpci
      - pricing_convergence
      - tholonic_balance
      - value_chain
    status: active

  - claim_id: ndc_metrics_can_support_sustainability_credit_analysis
    statement: >
      N-D-C metrics can support sustainability credit analysis by making system
      coherence, constraints, and contribution patterns explicit before loan or
      credit interpretation.
    supported_by:
      - sustainability_linked_loan_framework
    related_concepts:
      - ndc
      - sustainability_credit
      - esg
      - credit_analysis
      - system_coherence
    status: active

  - claim_id: aubeb_pdi_requires_ecosystem_services_gap_mapping
    statement: >
      AUBEB PDI work requires explicit ecosystem-services gap mapping because
      fisheries detail, women livelihood counts, and KPI formalization were
      identified as material missing data for the cTVF model.
    supported_by:
      - aubeb_pdi_feedback_source_note
    related_concepts:
      - ecosystem_services
      - gap_analysis
      - aubeb
      - pdi
      - kpi_formalization
    status: active

  - claim_id: financial_mechanism_parameter_is_needed_for_bond_kpis
    statement: >
      When a bond, fund, or credit facility is embedded in a supply-chain
      commercialization pathway, the model needs a financial_mechanism
      parameter that captures instrument type, counterparties, coupon structure,
      and market eligibility.
    supported_by:
      - aubeb_pdi_feedback_source_note
    related_concepts:
      - financial_mechanism
      - bond_kpi
      - market_eligibility
      - financial_abstraction
      - separation_of_concerns
    status: active

  - claim_id: expert_curated_documents_reduce_early_ai_cost_and_risk
    statement: >
      Expert-curated document input and summary data provide a lower-cost
      baseline for gap checking before connecting the cTVF front end to a
      growing database and more expensive AI infrastructure.
    supported_by:
      - aubeb_pdi_feedback_source_note
    related_concepts:
      - expert_curation
      - ai_costs
      - gap_analysis
      - document_intelligence
    status: active

  - claim_id: rootstock_training_system_fit_drives_cherry_orchard_adaptation
    statement: >
      Cherry orchard adaptation in Mediterranean conditions depends on the fit
      among variety, rootstock, training system, soil constraints, chill
      conditions, and mechanization requirements.
    supported_by:
      - corette_cherry_rootstocks_intensive_orchards_source_note
    related_concepts:
      - rootstock_adaptation
      - orchard_intensification
      - climate_adaptation
      - mechanization
      - phase_coherence
    status: active

  - claim_id: blue_finance_requires_character_capacity_collateral_and_consistency
    statement: >
      Blue finance investibility depends on bottom-up Character, Capacity, and
      Collateral, together with top-down Consistency or Certainty that helps
      make transactions bankable.
    supported_by:
      - blue_finance_3cs_blended_finance_source_note
    related_concepts:
      - blue_finance
      - investor_readiness
      - capacity
      - collateral
      - consistency
    status: active

  - claim_id: blended_finance_is_transitional_architecture_for_blue_economy_capacity
    statement: >
      Blended finance can act as transitional architecture for Blue Economy
      projects by de-risking untested revenue streams and helping build
      capacity, track record, and character.
    supported_by:
      - blue_finance_3cs_blended_finance_source_note
    related_concepts:
      - blended_finance
      - blue_economy
      - capacity_building
      - market_access
      - ecosystem_services
    status: active

  - claim_id: reported_vicuna_deposit_requires_technical_and_environmental_verification
    statement: >
      The reported Vicuna copper, gold, and silver deposit should be treated as
      an upstream supply-chain signal that requires technical reports,
      environmental controls, community consultation, and phase-specific data
      before any physical-flow inference.
    supported_by:
      - argentina_copper_gold_silver_deposit_source_note
    related_concepts:
      - upstream_mining
      - technical_verification
      - environmental_controls
      - community_consultation
      - physical_flow
    status: active

  - claim_id: blue_carbon_analysis_is_preliminary_due_to_limited_project_data
    statement: >
      The Blue Carbon cTVF package is preliminary because the current evidence
      base is mostly contextual and does not include project-specific ecological,
      social, governance, market, or financing data.
    supported_by:
      - blue_carbon_ctvf_gap_analysis
    related_concepts:
      - blue_carbon
      - ctvf
      - gap_analysis
      - data_sufficiency
      - preliminary_analysis
    status: active

  - claim_id: blue_carbon_requires_mrv_and_ecosystem_service_baselines
    statement: >
      A full Blue Carbon cTVF analysis requires MRV methodology, ecosystem-service
      baselines, carbon stock and sequestration data, fisheries data, livelihood
      data, governance evidence, and market-access evidence.
    supported_by:
      - blue_carbon_ctvf_gap_analysis
    related_concepts:
      - blue_carbon
      - mrv
      - ecosystem_services
      - baseline_data
      - market_access
    status: active

  - claim_id: blue_carbon_coupon_advice_requires_kpi_and_verification_evidence
    statement: >
      Blue Carbon coupon-structure advice should remain provisional until KPI
      definitions, KPI baselines, trigger thresholds, verification methods,
      investor eligibility, and risk-sharing arrangements are documented.
    supported_by:
      - blue_carbon_ctvf_gap_analysis
    related_concepts:
      - blue_carbon
      - coupon_structure
      - kpi_formalization
      - verification
      - financial_mechanism
    status: active
