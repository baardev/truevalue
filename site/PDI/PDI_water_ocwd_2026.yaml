      sources: "California DDW Annual Reports on water quality compliance; California Safe Drinking Water Act; multiple municipal agency annual reports (IRWD, Mesa Water, etc.)"

      B1_form_entering: "Raw groundwater or surface water — variable quality; not potable"
      B2_form_leaving: "Treated potable water meeting California Drinking Water Standards (22 CCR §64413); chlorine residual ≥0.2 mg/L; turbidity <0.3 NTU (filtered)"
