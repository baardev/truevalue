# ============================================================
# Phase Discovery Instrument (PDI) — Completed Instance
# Material: water_ocwd (Orange County Water District GWRS)
# Version 1.0
# Project: True Value Analytics — Supply Chain Intelligence
# ============================================================

pdi:

  material: "water_ocwd"
  analyst: "AI (Claude Sonnet 4.6)"
  date_completed: "2026-04-22"
  sources_overview: |
    OCWD Annual Report FY2023-24, Orange County Water District (ocwd.com/about-ocwd/reports-publications/)
    OCWD GWRS System Fact Sheet (ocwd.com/gwrs), Orange County Water District
    OC San Annual Report FY2023-24, Orange County Sanitation District (ocsan.gov)
    California State Water Resources Control Board, Title 22 Recycled Water Regulations (CCR Title 22, Div. 4, Ch. 3)
    California Department of Water Resources (CDWR), Annual Reports on water use
    USGS National Water Information System (NWIS) — Santa Ana River flow data (waterdata.usgs.gov)
    U.S. EPA (1998). Water Recycling and Reuse: The Environmental Benefits. EPA 909-F-98-001.
    Leverenz, H.L., Tchobanoglous, G., Asano, T. (2011). Direct potable reuse: A future imperative. Journal of Water Reuse and Desalination, 1(1), 2-10.
    Plumlee, M.H. et al. (2008). Indirect potable reuse: A sustainable water supply alternative. International Journal of Environmental Research and Public Health, 5(1), 32-33.
    WateReuse California (2022). GWRS performance benchmarks and regional comparison data.
    Orange County Water District (2020). Groundwater Management Plan 2020, OCWD.
    California DDW (Division of Drinking Water) — Groundwater Replenishment regulations and permits.

  geographic_scope:
    programme_envelope_ha: 520000
    countries:
      - country: "United States"
        sites:
          - "Orange County Groundwater Basin (Orange County, California)"
          - "OCWD Groundwater Replenishment System (GWRS), Fountain Valley, CA"
          - "OC San Plant No. 1, Fountain Valley, CA (primary/secondary treatment)"
          - "OC San Plant No. 2, Huntington Beach, CA (primary/secondary treatment)"
          - "Multiple Orange County municipal water agencies (IRWD, Mesa Water, etc.)"
          - "Santa Ana River intake and spreading facilities"
        notes: "Orange County, Southern California; groundwater basin covers ~520 km²; ~2.5 million population served"

  programme_scale:
    total_budget_USD: "UNKNOWN"
    # OCWD does not publish disaggregated project capex; GWRS capital cost estimated at ~USD 480M (Phase 1+2+3)
    implementation_years: 17
    notes: "GWRS in operation since 2008; expanded from 70 MGD to 130 MGD through Phase 1 (2008), Phase 2 (2015), Phase 3 (2023) expansions"

  financial_mechanism:
    instrument_name: ""
    instrument_type: ""
    notes: "OCWD is a special water district; funded via water replenishment assessments on groundwater pumpers; OC San funded separately via sewer service charges. Two separate financial mechanisms for what is functionally one integrated recycling system — institutional fragmentation reflected in financing."

  # ----------------------------------------------------------
  # MODULE 1 — Anchor the Chain
  # ----------------------------------------------------------

  module_1:

    A1_origin_state: |
      Surface water in the Santa Ana River and groundwater in the Orange County Groundwater Basin;
      unallocated or allocated under existing OCWD/CDWR water rights. Surface water is natural river
      flow (variable quality, seasonal); groundwater is stored in the basin managed by OCWD. Water
      is untreated, not yet connected to municipal supply infrastructure. Quality variable depending
      on upstream land use, agricultural runoff, and historical contamination.

    A2_market_state: |
      Advanced purified recycled water (NEWater equivalent) produced by the GWRS — treated through
      microfiltration (MF) + reverse osmosis (RO) + UV/H₂O₂ (advanced oxidation), independently
      certified under California Title 22 for indirect potable reuse. Injected into the Orange County
      Groundwater Basin for groundwater replenishment, where it is subsequently pumped by multiple
      municipal water agencies, re-treated to potable standard, and delivered to ~2.5 million consumers.
      Volume measured in million gallons per day (MGD) or ML/day at GWRS outlet.

    A3_origin_unit: "ML/day or acre-feet/year (AF/yr) of surface flow in Santa Ana River or groundwater storage in Orange County Basin"
    A4_market_unit: "ML/day of Title 22 certified advanced purified water injected into groundwater basin"

    A5_unit_changes: true
    A5_unit_change_location: |
      Unit changes occur at: (1) Phase 2 (drinking water treatment) — raw water becomes potable water
      meeting California Drinking Water Standards (22 CCR §64413); (2) Phase 9 (Title 22 certification) —
      secondary effluent becomes certified recycled water for indirect potable reuse.

    A6_physical_forms:
      - sequence: 1
        form: "Raw surface water — Santa Ana River flow; turbid, variable quality, seasonal"
        location_in_chain: "Phase 0–1: River diversions, spreading basins, municipal water agency intakes"
      - sequence: 2
        form: "Treated potable water — meeting California Drinking Water Standards"
        location_in_chain: "Phase 2–4: Multiple municipal water treatment plants through distribution to consumer tap"
      - sequence: 3
        form: "Wastewater (municipal effluent) — post-consumer discharge via OC San sewer system"
        location_in_chain: "Phase 5–7: OC San collection system and Water Reclamation Plants (Plant No. 1, Plant No. 2)"
      - sequence: 4
        form: "Secondary effluent — biologically treated; meeting secondary treatment standard; feed to GWRS"
        location_in_chain: "Phase 7: OC San secondary clarifier outlet; transferred to OCWD GWRS"
      - sequence: 5
        form: "GWRS advanced purified water — MF/RO/UV/H₂O₂ treated; Title 22 certified"
        location_in_chain: "Phase 8–11: OCWD GWRS facility through groundwater basin injection"
      - sequence: 6
        form: "Groundwater basin water — GWRS injection blended with existing basin water; pumped by municipal agencies"
        location_in_chain: "Phase 11 loop-closure: Orange County Groundwater Basin (shared commons)"

    A7_actor_classes:
      - sequence: 1
        actor: "OCWD — Orange County Water District (groundwater basin manager and GWRS operator)"
        point_in_chain: "Phase 0 (basin management), Phase 8–11 (advanced treatment, distribution, replenishment)"
        teeb_category: ""
        notes: "OCWD manages the Orange County Groundwater Basin and operates the GWRS advanced treatment facility. OCWD does NOT operate primary/secondary wastewater treatment — that is OC San. KEY THOLONIC VARIABLE: fragmented actor map."
      - sequence: 2
        actor: "OC San — Orange County Sanitation District (wastewater collection and primary/secondary treatment)"
        point_in_chain: "Phase 5–7: wastewater collection, primary treatment, secondary biological treatment"
        teeb_category: ""
        notes: "Separate legal entity from OCWD. Operates Plant No. 1 (Fountain Valley, 150 MGD capacity) and Plant No. 2 (Huntington Beach, 114 MGD). Sells secondary effluent to OCWD as feed for GWRS. Institutional boundary at Phase 7/8: the largest single D-C discontinuity in this chain."
      - sequence: 3
        actor: "Multiple Orange County municipal water agencies (IRWD, Mesa Water District, MWDOC, etc.)"
        point_in_chain: "Phase 1–4 (potable supply to consumers), Phase 11 (groundwater pumping from replenished basin)"
        teeb_category: ""
        notes: "~30 separate municipal water agencies pump from the groundwater basin. Each has its own treatment plant, distribution network, and customers. Second institutional fragmentation point: GWRS replenishment (Phase 11) benefits multiple uncoordinated downstream agencies."
      - sequence: 4
        actor: "California State Water Resources Control Board (SWRCB) and Division of Drinking Water (DDW)"
        point_in_chain: "Phase 9: Title 22 certification and regulatory approval; Phase 0: water rights (SWRCB)"
        teeb_category: ""
        notes: "Regulatory oversight; sets Title 22 standards for recycled water; issues permits for groundwater replenishment. Not an operational actor but defines D-constraints for Phases 0, 8, 9."
      - sequence: 5
        actor: "Residential, commercial, and industrial consumers (Orange County)"
        point_in_chain: "Phase 4: tap water use; Phase 5: wastewater generation"
        teeb_category: ""
        notes: "~2.5 million residents in the GWRS service area; end users of potable water and generators of used water that feeds GWRS."

    module_1_completion_check:
      A1_and_A2_specific_descriptions: true
      A3_and_A4_explicit_units: true
      A6_at_least_three_forms: true
      A7_at_least_three_actors: true

  # ----------------------------------------------------------
  # MODULE 2 — Event Inventory (13 events; 1 sub-process)
  # ----------------------------------------------------------

  module_2_events:

