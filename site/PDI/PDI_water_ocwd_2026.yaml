      B1_form_entering: "Raw municipal wastewater — contains gross solids, grit, organic matter, pathogens"
      B2_form_leaving: "Primary effluent — gross solids and grit removed; BOD ~35% reduced; still not suitable for reuse; OC San custody continues"
      B3_physical_state_changes: true
      B4_unit_changes: false
      B4_unit_entering: "MGD raw wastewater"
      B4_unit_leaving: "MGD primary effluent (same volume unit; quality partially improved)"
      B5_process_class: "chemical_thermal"
      B5_notes: "Bar screens, grit chambers, primary clarifiers — physical separation at OC San facilities"
      B6_process_class_changes: true
      B6_preceding_process_class: "aggregative (Event 7)"
      B7_custodian_before:
