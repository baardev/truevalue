      B1_form_entering: "Natural river flow and unallocated groundwater — Santa Ana River; Orange County Groundwater Basin"
      B2_form_leaving: "Water with legal allocation rights — OCWD holds basin management authority; municipal agencies hold overlying groundwater rights; water rights registered with CDWR/SWRCB"
      B3_physical_state_changes: false
      B4_unit_changes: true
      B4_unit_entering: "cfs (cubic feet per second) — natural river flow; unquantified basin storage"
      B4_unit_leaving: "AF/year (acre-feet per year) licensed abstraction rights; ML/day permitted basin replenishment capacity"
      B5_process_class: "aggregative"
      B5_notes: "Legal rights establishment, basin characterisation surveys, SWRCB licensing — administrative/aggregative"
      B6_process_class_changes: true
      B6_preceding_process_class: "none (first event in chain)"
      B7_custodian_before:
        class: "Natural commons / State of California"
        name: "California SWRCB (water rights regulator); natural environment"
      B8_custodian_after:
        class: "Special water district (basin manager)"
        name: "OCWD (groundwater basin management rights); municipal overlying rights holders"
      B9_custody_changes: true
      B10_ownership_changes: true
      B10_notes: "SWRCB adjudication assigns water rights to OCWD and municipal agencies; legal ownership established"
      B11_output_defined: true
      B11_quantity_and_unit: "AF/year of permitted groundwater extraction rights; OCWD basin management capacity in ML/day"
      B11_approximate_volume: "~280,000 AF/year total basin safe yield (OCWD Groundwater Management Plan 2020)"
      B11_recipient: "OCWD (basin management); municipal water agencies (overlying rights)"
      B12_opacity_reason: ""
      boundary_score: 5

