      sources: "OCWD Annual Report FY2023-24 (basin replenishment volumes); OCWD Groundwater Management Plan 2020 (safe yield and basin levels); CDWR groundwater data"

      B1_form_entering: "Injected advanced purified water — now blended in Orange County Groundwater Basin with existing basin water"
      B2_form_leaving: "Blended groundwater pumped by municipal water agencies for potable reuse (following conventional treatment); loop partially closes — basin water re-enters Phase 1 as raw groundwater source"
      B3_physical_state_changes: true
      B4_unit_changes: true
      B4_unit_entering: "MGD injected into basin (bulk replenishment flow)"
      B4_unit_leaving: "AF/year pumped by municipal agencies from replenished basin; m³ consumed by end users"
      B5_process_class: "commercial"
      B5_notes: "Metered delivery to end users (via municipal agencies); billing event; partial loop closure via groundwater basin; water re-enters Phase 1"
      B6_process_class_changes: true
      B6_preceding_process_class: "custodial (Event 12)"
      B7_custodian_before:
        class: "Special water district (basin manager)"
        name: "OCWD (basin management)"
      B8_custodian_after:
        class: "Multiple municipal water agencies (~30) pumping from shared basin"
        name: "IRWD, Mesa Water District, City of Anaheim, City of Orange, City of Fullerton, etc."
      B9_custody_changes: true
      B10_ownership_changes: true
      B10_notes: "Municipal agencies exercise overlying rights; water becomes agency-owned on pumping. Loop closure is PARTIAL: OCWD does not control re-abstraction (contrast NEWater where PUB controls both injection and reservoir abstraction). This is the structural tholonic gap: Phase 11 child-N does not return to Phase 0 through a single actor — it passes through a shared commons and multiple independent agencies."
      B11_output_defined: true
      B11_quantity_and_unit: "AF/year of groundwater pumped from basin by municipal agencies; basin level indicators; OCWD Annual Report tracks replenishment vs. extraction balance"
      B11_approximate_volume: "~280,000 AF/year (~945 ML/day) total basin extraction (OCWD Groundwater Management Plan 2020); GWRS contributes ~35% of basin replenishment"
      B11_recipient: "Multiple Orange County municipal water agencies (shared groundwater commons)"
      B12_opacity_reason: ""
      boundary_score: 5

  # ----------------------------------------------------------
  # MODULE 3 — Boundary Scoring and Phase Map
  # ----------------------------------------------------------

  module_3:

    phase_map:
      - phase: 0
        name: "Water rights, basin management, and abstraction permitting"
        begins_at_event: 1
        ends_at_event: 2
        child_n_output: "~280,000 AF/year permitted groundwater extraction rights; OCWD basin management authority"
        tvpci_notes: "D-dominant: SWRCB water rights licensing and OCWD basin management impose strong constraints. Multiple rights holders (OCWD + ~30 municipal agencies) introduce D-C fragmentation even at Phase 0."

      - phase: 1
        name: "Raw water abstraction"
        begins_at_event: 2
        ends_at_event: 3
        child_n_output: "ML/day raw water at municipal intake meters; ~945 ML/day total basin production"
        tvpci_notes: "Multiple municipal agencies abstract independently; no coordinated reporting. Contrast with NEWater where single PUB actor operates all abstraction."

      - phase: 2
        name: "Drinking water treatment"
        begins_at_event: 3
        ends_at_event: 5
        child_n_output: "ML/day potable water at treatment plant outlets; multiple plants across ~30 agencies"
        tvpci_notes: "Fragmented: each of ~30 agencies operates its own treatment plant. Published compliance data at state level but granular inter-agency comparison not easily available."

      - phase: 3
        name: "Service reservoir and pressurised storage"
        begins_at_event: 5
        ends_at_event: 6
        child_n_output: "ML in storage and ML/day distribution input (aggregate across ~30 agencies)"
        tvpci_notes: "Highly fragmented: each agency has its own storage infrastructure. No centralised reporting of aggregate storage at reservoir-level."

      - phase: 4
        name: "Consumer delivery and use"
        begins_at_event: 6
        ends_at_event: 7
        child_n_output: "m³ metered to consumer; ~710 ML/day aggregate consumption (~75 gallons/day/person)"
        tvpci_notes: "High per-capita consumption versus Singapore (75 vs 38 gallons/day). California conservation mandates attempt to reduce this."

      - phase: 5
        name: "Wastewater collection and conveyance"
        begins_at_event: 7
        ends_at_event: 8
        child_n_output: "~185 MGD (~700 ML/day) wastewater at OC San plant headwork meters"
        tvpci_notes: "New actor enters: OC San. Separate billing structure (sewer service charge distinct from water charge); separate governing board. D-C discontinuity begins here."

      - phase: 6
        name: "Primary wastewater treatment"
        begins_at_event: 8
        ends_at_event: 9
        child_n_output: "~183 MGD primary effluent at OC San primary clarifier outlet; BOD ~35% reduced"
        tvpci_notes: "OC San operates. Reasonable transparency via NPDES permit compliance; but OC San's opaque inter-agency cost allocation reduces D-C coherence."

      - phase: 7
        name: "Secondary biological treatment"
        begins_at_event: 9
        ends_at_event: 10
        child_n_output: "~130 MGD secondary effluent at OC San secondary clarifier outlet; destined for GWRS"
        tvpci_notes: "Still OC San at this event. The HANDOFF to OCWD occurs at Event 10 (Phase 8 boundary) — the largest single D-C discontinuity in this chain. OC San and OCWD have separate governing boards, separate finances, and negotiate the secondary effluent supply agreement separately."

      - phase: 8
        name: "Advanced tertiary treatment — GWRS (OC San → OCWD handoff)"
        begins_at_event: 10
        ends_at_event: 11
        child_n_output: "~130 MGD (~492 ML/day) advanced purified water at GWRS outlet; TOC <0.5 mg/L; exceeds California primary drinking water standards"
        tvpci_notes: "FIRST MAJOR INSTITUTIONAL HANDOFF: OC San secondary effluent → OCWD GWRS. B9=true, B10=true. Two separate legal entities with separate governance and finances negotiate the secondary effluent supply agreement. This boundary crossing is the largest cost driver vs. NEWater. Treatment cost: ~USD 1.25/m³ (OCWD Annual Report FY2023-24 operational data). Energy: ~4.2 kWh/m³ (RO-dominated; OCWD 2023)."

      - phase: 9
        name: "Title 22 quality certification and California DDW regulatory approval"
        begins_at_event: 11
        ends_at_event: 12
        child_n_output: "~130 MGD Title 22 certified advanced purified recycled water; OCWD Annual Report monthly quality data"
        tvpci_notes: "California regulatory framework is more complex than Singapore's due to multi-agency oversight (SWRCB, DDW, Regional Water Quality Control Boards). Each layer adds D constraint without proportional C integration."

      - phase: 10
        name: "Recycled water distribution — injection wells and spreading basins"
        begins_at_event: 12
        ends_at_event: 13
        child_n_output: "~130 MGD (~492 ML/day) injected at Talbert Barrier and Alamitos Barrier; ML/day spreading basin percolation"
        tvpci_notes: "SECOND INSTITUTIONAL TRANSITION: OCWD injects into shared groundwater commons. Water passes from OCWD control into a basin accessed by ~30 independent agencies. The downstream distribution is NOT under OCWD's institutional control — contrast with NEWater where PUB operates its own dedicated distribution network."

      - phase: 11
        name: "End-use delivery and groundwater basin replenishment"
        begins_at_event: 13
        ends_at_event: null
        child_n_output: "~280,000 AF/year (~945 ML/day) basin groundwater pumped by municipal agencies; GWRS contributes ~35% of total replenishment"
        tvpci_notes: "STRUCTURAL THOLONIC GAP: Phase 11 child-N does NOT close back to Phase 0 through a single actor. Water enters a shared groundwater commons controlled by OCWD but pumped by ~30 independent municipal agencies. The tholonic recursion — Phase 11 child-N becoming Phase 0 parent-N — is BROKEN at this point. OCWD cannot ensure that the water it recycled is the same water that returns to Phase 1 via any specific agency. Compare NEWater: PUB blends into its own reservoirs and controls re-abstraction directly. This structural gap is predicted by the Tholonic model to produce lower N stability and higher system cost — confirmed by the USD 0.35/m³ treatment cost premium over NEWater."

    subprocesses:
      - event_number: 4
        event_name: "Preliminary screening and settling"
        belongs_to_phase: 2
        reason: "Score 1; process class changes but no measurable independent output, no physical state change, no unit change, no custody change. Internal preparatory step within municipal drinking water treatment phase."

