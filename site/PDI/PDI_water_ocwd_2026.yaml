        name: "OCWD (groundwater basin manager); Santa Ana River (natural)"
      B8_custodian_after:
        class: "Municipal water agency"
        name: "Various: Irvine Ranch Water District, Mesa Water District, City of Anaheim, etc. (~30 agencies)"
      B9_custody_changes: true
      B10_ownership_changes: true
      B10_notes: "Municipal agencies exercise overlying groundwater rights; water transfers to agency custody on abstraction"
      B11_output_defined: true
      B11_quantity_and_unit: "ML/day raw water at municipal agency intake meters"
      B11_approximate_volume: "~280,000 AF/year (~945 ML/day) total basin production (OCWD Groundwater Management Plan 2020)"
      B11_recipient: "Individual municipal water agencies (metered at pump or diversion)"
      B12_opacity_reason: ""
      boundary_score: 6

    - event_number: 3
