      B2_form_leaving: "Raw water abstracted and flowing in municipal intake infrastructure — pumped from wells or diverted from river; under municipal agency control"
      B3_physical_state_changes: true
      B4_unit_changes: true
      B4_unit_entering: "cfs river flow or AF stored in basin (static or flowing natural)"
      B4_unit_leaving: "ML/day raw water at municipal intake meters"
      B5_process_class: "extractive"
      B5_notes: "Physical pumping of groundwater and diversion of surface water; extractive process"
      B6_process_class_changes: true
      B6_preceding_process_class: "aggregative (Event 1)"
      B7_custodian_before:
