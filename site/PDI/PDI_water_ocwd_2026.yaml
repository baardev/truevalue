        name: "OC San — Orange County Sanitation District"
      B9_custody_changes: true
      B10_ownership_changes: true
      B10_notes: "Consumer discharges; OC San takes ownership under California Environmental Quality Act; consumers pay sewer service charge. NOTE: OC San is a SEPARATE ENTITY from municipal water agencies — second actor class enters chain here."
      B11_output_defined: true
      B11_quantity_and_unit: "MGD wastewater at OC San plant headwork meters"
      B11_approximate_volume: "~185 MGD (~700 ML/day) average daily flow at OC San Plant No. 1 + Plant No. 2 combined (OC San Annual Report FY2023-24)"
