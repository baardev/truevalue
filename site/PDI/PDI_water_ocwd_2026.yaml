      B9_custody_changes: false
      # KEY THOLONIC VARIABLE: At this boundary OCWD still retains notional custody via basin management
      # but the water enters a shared commons accessed by ~30 independent municipal agencies
      B10_ownership_changes: false
      B10_notes: "OCWD manages the basin but does not own the water once injected — it becomes part of the shared Orange County Groundwater Basin, subject to overlying rights of ~30 municipal agencies. This is structurally different from NEWater: PUB injects into its own managed reservoirs and controls the re-abstraction. In OCWD's case, the loop does NOT close through a single actor."
