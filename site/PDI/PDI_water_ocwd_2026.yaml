      The central structural feature of this chain — by contrast with water_newwater — is actor
      fragmentation: three distinct institutional actors (municipal water agencies, OC San, OCWD)
      each hold different phases of the recycling loop, and the loop closure passes through a
      shared groundwater commons not controlled by any single actor.

      Two inter-institutional handoffs create D-C discontinuities:
      1. OC San → OCWD at Phase 7/8 boundary (Event 10): the largest single institutional seam.
         Two separate legal entities, separate governing boards, separate finances. The supply
         agreement between OC San and OCWD is the contractual expression of this D-C gap. Each
         negotiation, compliance audit, and interface protocol is a coordination overhead cost that
         does not produce any additional physical output.
      2. OCWD → shared groundwater commons at Phase 11 (Event 13): OCWD injects but cannot
         control re-abstraction. The loop does not close through a single actor.

      The Tholonic model predicts: each institutional boundary creates a D-C discontinuity;
      accumulated discontinuities lower chain-level N stability; lower N stability manifests as
      higher operating cost. This prediction is confirmed: OCWD treatment cost ~USD 1.25/m³
      vs. NEWater ~USD 0.88/m³ — a 42% premium, using identical treatment technology.

      One low-transparency phase (Phase 3: service reservoir): fragmented storage infrastructure
      across ~30 agencies creates a gap not present in NEWater's unified PUB system.

      Key metrics (OCWD Annual Report FY2023-24 / OC San Annual Report FY2023-24):
      - GWRS production capacity: ~130 MGD (~492 ML/day); expanding to ~150 MGD by 2028
      - GWRS energy intensity: ~4.2 kWh/m³ (RO-dominated; OCWD 2023)
      - GWRS treatment cost: ~USD 1.25/m³ (OCWD operational data; comparable periods)
      - GWRS contribution to Orange County basin supply: ~35%
      - Orange County per capita consumption: ~75 gallons/day vs Singapore 38 gallons/day
      - Non-revenue water: ~8–10% (vs Singapore 4.5%) — reflects older infrastructure and
        fragmented agency management

