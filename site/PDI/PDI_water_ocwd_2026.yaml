      B11_approximate_volume: "~183 MGD primary effluent (OC San Annual Report FY2023-24; ~1% volume loss to sludge)"
      B11_recipient: "OC San secondary treatment (self-held)"
      B12_opacity_reason: ""
      boundary_score: 3

    - event_number: 9
      event_name: "Secondary biological treatment — activated sludge (OC San)"
      sources: "OC San Annual Report FY2023-24 (secondary effluent quality, GWRS feed flow); OC San NPDES permit; Plumlee et al. (2008)"

      B1_form_entering: "Primary effluent — BOD ~35% reduced; not suitable for reuse"
      B2_form_leaving: "Secondary effluent at OC San outlet — BOD <25 mg/L; TSS <25 mg/L; meeting secondary treatment standard; available as GWRS feed"
      B3_physical_state_changes: true
      B4_unit_changes: false
      B4_unit_entering: "MGD primary effluent"
      B4_unit_leaving: "MGD secondary effluent meeting secondary treatment standard (GWRS-quality feed)"
      B5_process_class: "chemical_thermal"
      B5_notes: "Activated sludge biological treatment; aeration basins; secondary clarifiers — all at OC San facilities"
      B6_process_class_changes: false
      B6_preceding_process_class: "chemical_thermal (Event 8)"
      B7_custodian_before:
        class: "Regional sanitation district (primary treatment)"
        name: "OC San"
      B8_custodian_after:
        class: "Regional sanitation district (secondary treatment outlet)"
        name: "OC San"
      B9_custody_changes: false
      B10_ownership_changes: false
      B10_notes: "Still OC San at this event; handoff to OCWD occurs in Event 10 — the key institutional boundary"
      B11_output_defined: true
      B11_quantity_and_unit: "MGD secondary effluent at secondary clarifier outlet; BOD <25 mg/L; TSS <25 mg/L"
      B11_approximate_volume: "~130 MGD secondary effluent destined for GWRS feed (balance discharged to ocean via NPDES); OC San Annual Report FY2023-24"
      B11_recipient: "OC San → OCWD GWRS (see Event 10 — custody handoff)"
      B12_opacity_reason: ""
      boundary_score: 2

    - event_number: 10
      event_name: "Advanced tertiary treatment — GWRS MF/RO/UV/H₂O₂ (OC San → OCWD handoff)"
      sources: "OCWD Annual Report FY2023-24 (GWRS production: 130 MGD); OCWD GWRS System Fact Sheet; Leverenz et al. (2011); WateReuse California (2022)"

      B1_form_entering: "Secondary effluent at OC San outlet — meeting secondary treatment standard; OC San custody"
      B2_form_leaving: "Advanced purified recycled water at GWRS outlet — MF (0.2 µm) + RO (>99% dissolved solids rejection) + UV/H₂O₂ (advanced oxidation); TOC <0.5 mg/L; conductivity <50 µS/cm; exceeds California primary drinking water standards"
      B3_physical_state_changes: true
      B4_unit_changes: true
      B4_unit_entering: "MGD secondary effluent (volume only; OC San custody)"
      B4_unit_leaving: "MGD advanced purified water meeting California DDW potable reuse standard (volume + quality specification; OCWD custody)"
      B5_process_class: "chemical_thermal"
      B5_notes: "MF membrane filtration, RO high-pressure separation, UV/H₂O₂ advanced oxidation — all at OCWD GWRS facility"
      B6_process_class_changes: false
      B6_preceding_process_class: "chemical_thermal (Event 9)"
      B7_custodian_before:
        class: "Regional sanitation district (secondary effluent producer)"
        name: "OC San — Orange County Sanitation District"
      B8_custodian_after:
        class: "Special water district (GWRS advanced treatment)"
        name: "OCWD — Orange County Water District"
      B9_custody_changes: true
      # KEY THOLONIC VARIABLE: OCWD = true (OC San → OCWD); NEWater = false (PUB → PUB)
      B10_ownership_changes: true
      B10_notes: "OC San transfers secondary effluent to OCWD under formal supply agreement. OCWD takes ownership on delivery to GWRS headworks. This is the largest single institutional D-C discontinuity in this chain: two separate legal entities, two separate governing boards, two separate financial structures, crossing at this event. Contrast: NEWater Event 10 has B9=false, B10=false (same PUB actor throughout)."
      B11_output_defined: true
      B11_quantity_and_unit: "MGD advanced purified water at GWRS outlet; TOC, conductivity, pharmaceuticals tested and published monthly by OCWD"
      B11_approximate_volume: "~130 MGD (~492 ML/day) at current GWRS Phase 3 capacity; expanding to ~150 MGD by 2028 (OCWD Annual Report FY2023-24)"
      B11_recipient: "OCWD (self-held; fed to Title 22 certification and groundwater injection)"
      B12_opacity_reason: ""
      boundary_score: 5

    - event_number: 11
      event_name: "Title 22 quality certification and California DDW regulatory approval"
      sources: "California Title 22 Recycled Water Regulations (CCR Title 22, Div. 4, Ch. 3); California DDW permit for GWRS; OCWD Annual Report FY2023-24 (compliance data)"

      B1_form_entering: "Advanced purified water (post-GWRS) — purified but not yet formally certified for groundwater replenishment"
      B2_form_leaving: "Title 22 certified advanced purified recycled water — independently sampled and confirmed to meet California DDW standards for groundwater replenishment; legal status to inject into Orange County Groundwater Basin"
      B3_physical_state_changes: false
      B4_unit_changes: true
      B4_unit_entering: "MGD advanced purified water (uncertified)"
      B4_unit_leaving: "MGD Title 22 certified advanced purified recycled water (volume + regulatory status)"
      B5_process_class: "certification"
      B5_notes: "California DDW regulatory sampling; OCWD internal laboratory; third-party laboratory verification; regulatory sign-off per Title 22"
      B6_process_class_changes: true
      B6_preceding_process_class: "chemical_thermal (Event 10)"
      B7_custodian_before:
        class: "Special water district (GWRS)"
