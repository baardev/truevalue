      B5_notes: "Metered delivery, billing, legal ownership transfer to consumer"
      B6_process_class_changes: true
      B6_preceding_process_class: "custodial (Event 5)"
      B7_custodian_before:
        class: "Municipal water agency (distribution)"
        name: "Various OC municipal agencies"
      B8_custodian_after:
        class: "Consumer (residential / commercial / industrial)"
        name: "Named consumer at metered address"
      B9_custody_changes: true
      B10_ownership_changes: true
      B10_notes: "Consumer purchases; legal ownership transfers on metered delivery per California water utility tariff"
      B11_output_defined: true
      B11_quantity_and_unit: "m³ or CCF metered to consumer per billing cycle"
      B11_approximate_volume: "~284 L/day/person (~75 gallons/day; 2.5 million residents); total ~710 ML/day (CDWR 2023 data)"
      B11_recipient: "Individual consumer at metered premises (Orange County)"
      B12_opacity_reason: ""
      boundary_score: 5

    - event_number: 7
      event_name: "Wastewater collection — consumer discharge into OC San sewer system"
      sources: "OC San Annual Report FY2023-24 (collection system flows: 185 MGD average daily flow); OC San Collection System Master Plan"

      B1_form_entering: "Post-use tap water — contaminated, mixed with household/commercial/industrial waste"
      B2_form_leaving: "Municipal wastewater (sewage) collected in OC San regional sewer system — conveyed to Plant No. 1 or Plant No. 2"
      B3_physical_state_changes: true
      B4_unit_changes: true
      B4_unit_entering: "m³ consumed at individual premises"
      B4_unit_leaving: "MGD (million gallons per day) wastewater in OC San collection system"
