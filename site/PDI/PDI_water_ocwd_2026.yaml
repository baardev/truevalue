    - event_number: 12
      event_name: "Recycled water distribution — injection wells and spreading basins"
      sources: "OCWD Annual Report FY2023-24 (injection/spreading volumes by location); OCWD Groundwater Management Plan 2020 (Talbert and Alamitos barrier systems)"

      B1_form_entering: "Title 22 certified advanced purified recycled water — at OCWD GWRS injection pumping station"
      B2_form_leaving: "Advanced purified water flowing through injection well network to Talbert Barrier and Alamitos Barrier; water entering groundwater basin subsurface"
      B3_physical_state_changes: false
      B4_unit_changes: false
      B4_unit_entering: "MGD certified water at GWRS injection pumps"
      B4_unit_leaving: "MGD injected into groundwater basin wells and spreading basins"
      B5_process_class: "custodial"
      B5_notes: "Pressurised injection wells and gravity spreading basins; distribution to injection points; no material transformation"
      B6_process_class_changes: true
      B6_preceding_process_class: "certification (Event 11)"
      B7_custodian_before:
        class: "Special water district (GWRS injection)"
