# MkDocs config — config file lives in scripts/; paths below are relative to this file.
# Build:  mkdocs build -f scripts/mkdocs.yml
# Serve:  mkdocs serve  -f scripts/mkdocs.yml

site_name: Supply Chain Intelligence Docs
site_description: Gold & shea supply chain phase templates, rules, APIs, and methodology
site_url: http://dev.tholonia.com:8000/site

docs_dir: ../frontend/docs
site_dir: ../site

theme:
  name: material
  custom_dir: ../overrides
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: false

extra_css:
  - stylesheets/mkdocs-site.css

extra:
  homepage: /
  wiki_home: /site/

nav:
  - Home: index.md
  - Supply chain phase templates:
      - Abstract template: Repos/intra/PDI/ABSTRACT_SUPPLY_CHAIN_PHASE_TEMPLATE.md
