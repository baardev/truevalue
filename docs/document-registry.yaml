# TVF Document Registry
#
# Curated top-level registry of official and support documents for TrueValue
# Analytics projects. AI notes under docnav/.ai_notes/ are self-describing and
# kept separate. Schema files, generated JSON, and frontend HTML are listed at
# summary level only; see the relevant project folder for the full inventory.
#
# Field reference:
#   doc_id        unique slug used by content-sync and cross-references
#   path          path relative to repo root
#   title         human-readable label
#   type          official | support | schema | frontend | archive
#   status        active | draft | deprecated | provisional
#   domain        primary domain (tvpci | tholonic | gold | shea | pdi | meta)
#   tags          concept tags used by content-sync to build work lists
#   last_updated  ISO date of last substantive edit
#   description   one-line summary
#   related_docs  list of doc_ids (not file paths)
#   derived       artifacts regenerated from this source (tex, pdf, json, etc.)
#
# Tag vocabulary (use consistently):
#   tvpci        TVPCI scoring methodology and parameters
#   tvpci-r      Parallel recycling observable R_p and TVPCI-R aggregate
#   b-chain      Chain-level balance score B_chain
#   tholonic     N-D-C tholonic framework
#   ndc          N-D-C triadic structure (supply/value chain application)
#   supply-chain Physical supply chain phases and phase map
#   value-chain  Value chain and margin analysis
#   recycling    Ecological return, waste streams, R_p
#   gold         Gold supply chain specific content
#   shea         Shea supply chain specific content
#   pdi          Phase Discovery Instrument methodology
#   phi          Golden ratio / phi engine
#   constants    Five tholonic constants (phi, e, ln2, sqrt2, pi/4)
#
schema_version: "1"
last_updated: "2026-05-10"

