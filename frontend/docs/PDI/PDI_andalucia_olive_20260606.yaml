  coherence_scores:
    pi: 75.9
    phi: 72.0
    sqrt2: 68.0
    ln2: 70.0
    e: 58.0

  analyst_notes: |
    The Andalucia olive ecosystem is structurally failing at both ends of the supply chain: at the
    ecosystem foundation (Phase 0, balance 65.4%) and at the market (Phase 5, balance 65.3%). These
    are the twin bottlenecks. Between them, Phases 1-3 are comparatively functional, which explains
    why the system produces record export volumes and revenues despite structural degradation.

    The D-C imbalance is strongest in Phase 7 (Ecosystem Restoration) where D=265, C=172, gap=93.
    This is the highest constraint-to-contribution gap in the chain. No financial instrument exists to
    close this gap at scale. The second largest gap is Phase 5 (Trade), where D=268, C=175, gap=93:
    the constraint of the bulk export structure is not offset by any meaningful brand-building
    contribution capacity in the cooperative system.

    The comparison with Marina Alta is analytically revealing. The two systems cross at Phase 2:
    Marina Alta's harvest crash (76.5%) is Andalucia's strongest point (mechanised harvest 88.7%).
    Andalucia then crashes where Marina Alta recovers: Phase 4 (74.5% vs Marina Alta's 98.3%),
    Phase 5 (65.3% vs Marina Alta's 93.0%). The systems share Phase 6-7 weakness but for different
    reasons: Marina Alta lacks investment capital for crop transition; Andalucia lacks both an
    investment instrument and the soil foundation to support transition.

    Recommended intervention sequence for Andalucia: (1) Phase 0 first: soil restoration via
    cover crops and cessation of herbicides (Danyadara methodology) increases water retention and
    reduces erosion without waiting for governance; (2) Phase 5 simultaneously: brand investment
    and DOP take-up rate, targeting the EUR 890M value gap; (3) Phase 7 last: landscape-scale
    restoration follows from Phase 0 individual farm improvements aggregated to watershed scale.

    Recommended bond instrument: Mediterranean Olive Ecosystem Bond targeting Phases 0, 6, and 7,
    with performance triggers linked to: (1) ha under cover crop management; (2) % soil organic
    matter increase at enrolled farms; (3) DOP/Olivares Vivos certification area; (4) EUR/kg
    average export price improvement vs baseline. Scale: EUR 20-50M, eligible under EU Soil
    Strategy 2030 and LIFE+ programme frameworks.
