pdi:
  material: "Andalucia Olive Oil Ecosystem"
  analyst: "TrueValue Analytics / Dr Sarah Jones (CLARITY Coalition)"
  date_completed: "2026-06-06"
  service_type: "ecosystem_agricultural"
  basin: "andalucia"
  paired_with: "marina_alta"
  hub: "olive_compare"

  sources_overview: |
    1. Olivares Vivos project: University of Jaen and SEO/BirdLife biodiversity monitoring in Andalucia olive groves (2016-2026): olivaresvivos.com
    2. Danyadara land regeneration NGO (Suryalila Retreat Centre, Cadiz): syntropic agroforestry and desertification reversal: danyadara.org
    3. International Olive Council (IOC): world olive oil production and trade statistics 2023/24: internationaloliveoil.org
    4. Dcoop (Jaen): cooperative data; 300,000 MT storage capacity, world's largest olive oil operator: dcoop.es
    5. Foods and Wines from Spain: Andalucia olive variety and DOP certification data: foodswinesfromspain.com
    6. Ministerio de Agricultura, Pesca y Alimentacion (MAPA): Spanish olive oil production and area data 2024
    7. IOC trade statistics: Spain export price EUR 3.22/kg vs Italy EUR 4.42/kg (2023/24): internationaloliveoil.org
    8. SEO/BirdLife: Biodiversity monitoring Olivares Vivos programme: seo.org
    9. Guadalquivir River Basin Authority (CHG): water allocation and deficit reporting: chguadalquivir.es
    10. Dr Javier Diaz-Forestier (Univ. Jaen): olive grove erosion rates 50-100 T/ha/yr in Sierra Magina: researchgate.net
    11. Regen Academy Spain / Region Consulting: regenerative transition consulting for conventional farms
    12. Huerta Pavon (Malaga province): permaculture and edible understory consulting
    13. Sarah Jones (CLARITY Coalition) research communication to TrueValue Analytics (2026-06-06)
    14. CGTN Europe: Spanish olive industry bulk export structure: youtube.com

  geographic_scope:
    region: "Andalucia, southern Spain"
    key_provinces:
      - "Jaen (province: 45% of Spanish production; 60 million olive trees; 95% of UAA under olive)"
      - "Cordoba (second largest; Denominacion de Origen Baena, Priego de Cordoba)"
      - "Sevilla (low-altitude coastal production zones)"
      - "Granada and Malaga (mountain micro-climates; emerging premium production)"
      - "Cadiz (coastal and inland; Danyadara syntropic programmes)"
    total_olive_area_ha: 1800000
    national_share_pct: 72
    global_production_share_pct: 37
    main_varieties:
      - "Picual (Jaen dominant: 50% of Spanish production; high polyphenol, robust flavour)"
      - "Hojiblanca (Cordoba, Malaga: mild, fruity)"
      - "Arbequina (widespread; early harvest, mild oil)"
      - "Manzanilla (Sevilla: table olives and oil)"
    soil_type: "Clay-loam on limestone and calcareous marl; heavily compacted after decades of herbicide bare-soil management"
    climate: "Mediterranean semi-arid to arid; 250-600mm rainfall; extended summer drought; average 17-19 C"
    water_system: "Guadalquivir river basin (reservoir-dependent); no equivalent karstic aquifer recharge system; mean annual deficit 2.5 km3 in recent drought years"

  agricultural_parameters:
    olive_grove_area_andalucia_ha: 1800000
    national_production_share_pct: 72
    global_output_share_pct: 37
    picual_variety_share_pct: 50
    bulk_export_share_pct: 67
    spain_avg_export_price_eur_per_kg: 3.22
    italy_avg_export_price_eur_per_kg: 4.42
    annual_value_gap_eur: 890000000
    dcoop_storage_capacity_mt: 300000
    erosion_rate_sierra_magina_t_ha_yr: "50-100"
    olivares_vivos_enrolled_farms: "approximately 200 (2024)"
    olivares_vivos_area_ha: "approximately 12000 (sub-1% penetration)"
    syntropic_programme_cadiz_danyadara: "pre-commercial; demonstration scale only"
    guadalquivir_annual_deficit_km3: 2.5
    dop_certified_share_pct: "approximately 8"

  supply_chain_phases:
    phase_0:
      id: 0
      name: "Ecosystem Baseline"
      phase_category: "Upstream"
      physical_state_in: "Mediterranean landscape: limestone hillsides, clay-loam soils, native shrubland remnants, Guadalquivir watershed"
      physical_state_out: "Agricultural potential: available soil, rainfall retention, pollinator populations, erosion resistance"
      primary_transformation: "Precipitation and solar energy converted to biological capital via soil microbiome, root networks, and native vegetation"
      typical_time_scale: "Decades to centuries (soil formation); annually (rainfall and evapotranspiration cycle)"
      transparency_level: "Low"
      measurable_output: "Soil organic matter %; erosion rate T/ha/yr; aquifer recharge mm/yr; species count"
      output_unit: "%; T/ha/yr; mm/yr; species count"
      data_status: "PARTIAL"
      primary_sources:
        - "Dr Javier Diaz-Forestier (Univ. Jaen): olive erosion rates 50-100 T/ha/yr"
        - "Olivares Vivos (SEO/BirdLife): biodiversity monitoring Andalucia olive groves"
        - "CHG Guadalquivir Basin Authority: watershed water balance"
        - "MAPA: national land degradation monitoring"
      opacity_score: 3
      key_values:
        soil_organic_matter_monoculture_pct: "0.5-1.5 (critically low; EU target 3.5%)"
        erosion_rate_jaen_t_ha_yr: "50-100"
        olivares_vivos_biodiversity_deficit: "60-80% fewer bird species vs polyculture reference"
        guadalquivir_annual_deficit_km3: 2.5
        bare_soil_management_pct: "approximately 70% of Andalucia groves"
        soil_compaction: "High; herbicide regime prevents cover crop development"
        aquifer_recharge_rate: "No equivalent karstic high-recharge system; reservoir dependent"
      notes: >
        The Andalucia olive ecosystem baseline is severely degraded by four decades of monoculture
        herbicide management. The conventional bare-soil approach eliminates understory vegetation,
        causes compaction, dramatically reduces soil organic matter (0.5-1.5% vs EU target of 3.5%),
        and leaves soils exposed to the full force of Andalucia's intense summer rainstorms. Erosion
        rates of 50-100 T/ha/yr in Jaen province (documented by Univ. Jaen / Olivares Vivos research)
        are among the highest in Europe. Unlike the Marina Alta karstic aquifer system, Andalucia's
        interior olive regions have no high-recharge aquifer fallback; water dependency is entirely on
        the Guadalquivir reservoir system, which has run at a 2.5 km3 annual deficit in recent drought
        years. Biodiversity is critically impaired: Olivares Vivos monitoring finds 60-80% fewer bird
        species in conventional monoculture vs polyculture reference sites.
        Opacity score 3: soil biology monitoring is sparse; basin-level water deficit data is public
        but farm-level soil condition is not systematically reported.

    phase_1:
      id: 1
      name: "Agricultural Production"
      phase_category: "Upstream"
      physical_state_in: "Degraded soil + irrigation water from Guadalquivir + purchased inputs (fertilisers, herbicides, pesticides)"
      physical_state_out: "Maturing olives on tree; annual growth cycle sustained"
      primary_transformation: "Monoculture management: pruning, herbicide floor management, drip irrigation (intensive), fertilisation"
      typical_time_scale: "Annual (harvest cycle); 10-15 year orchard establishment"
      transparency_level: "Medium"
      measurable_output: "Tonnes olives per ha; olive oil extraction rate %; total Andalucia production T/yr"
      output_unit: "T/ha/yr; %; T"
      data_status: "PARTIAL"
      primary_sources:
        - "MAPA: Andalucia olive production statistics 2023/24"
        - "IOC: Spain production data"
        - "Dcoop: cooperative production reports"
        - "Danyadara: conventional vs regenerative yield comparison data"
      opacity_score: 2
      key_values:
        andalucia_olive_area_ha: 1800000
        average_yield_t_per_ha: "3-5 (intensive irrigated); 1-2 (traditional rain-fed)"
        national_production_share_pct: 72
        extraction_rate_pct: "18-22"
        intensive_irrigated_share_pct: "approximately 40"
        herbicide_use: "Widespread bare-soil management; Roundup common in conventional"
        fertiliser_dependency: "High; soil organic matter too low for nutrient cycling"
      notes: >
        Andalucia dominates Spanish olive production with 1.8 million ha (72% of national area).
        Intensive irrigated groves (super-high-density, drip-fed) achieve 3-5 T/ha but at the cost
        of higher water consumption and full dependence on external fertilisers due to absent soil
        biology. Traditional rain-fed olive groves (the majority by area) yield 1-2 T/ha and are
        increasingly water-stressed as drought intensifies. The herbicide bare-soil management model
        is structurally self-limiting: by eliminating cover crops, it prevents the organic matter
        accumulation that would improve water retention, reduce erosion, and build nutrient cycling.
        Danyadara (Cadiz) and Olivares Vivos document that transition to cover crops and understory
        planting increases soil moisture retention by 20-35% in the first three years.
        Opacity score 2: MAPA and IOC publish production data; individual farm-level inputs not reported.

    phase_2:
      id: 2
      name: "Harvest"
      phase_category: "Midstream"
      physical_state_in: "Ripe olives on tree (Picual: November-January harvest window)"
      physical_state_out: "Harvested olives in bulk bins; field delivered to cooperative or private mill within 24-48 hours"
      primary_transformation: "Mechanical harvest: tractor-mounted trunk shakers and pneumatic hand-held combs; minimal manual labour required"
      typical_time_scale: "November to January (3-month campaign)"
      transparency_level: "Medium"
      measurable_output: "Tonnes olives harvested per campaign; harvest cost EUR/T; machine utilisation rate"
      output_unit: "T/season; EUR/T"
      data_status: "POPULATED"
      primary_sources:
        - "IOC: Spain olive harvest methods and mechanisation statistics"
        - "Dcoop: cooperative harvest intake data"
        - "MAPA: harvest campaign reports"
      opacity_score: 1
      key_values:
        mechanisation_rate_pct: "approximately 90 (Jaen and Cordoba; lower in mountain zones)"
        harvest_cost_eur_per_t: "50-120 (mechanised); 200-400 (manual)"
        labour_requirement_vs_manual: "80% reduction vs manual picking"
        harvest_window_days: "Approximately 90 (Nov-Jan campaign)"
        bulk_intake_standard: "Olives to mill within 24-48 hours of harvest"
        quality_issue: "Bruising from mechanical shaking reduces polyphenol content in final oil"
      notes: >
        Andalucia's olive harvest is the most mechanised in the world, using trunk shakers and 
        pneumatic combs that reduce labour costs by 80% compared to manual picking. This mechanisation 
        is Andalucia's core operational efficiency advantage over artisanal regions. The harvest window
        (November-January for Picual) is wide and predictable, reducing weather vulnerability. However,
        mechanical shaking causes bruising which accelerates oxidation and reduces polyphenol content,
        creating a quality ceiling for extra-virgin grades. This is a structural trade-off between
        volume efficiency and premium quality positioning. Mountain zones (Granada, Malaga) retain more
        manual and semi-mechanical methods, producing higher-quality oil from older, wider-spaced trees.
        Opacity score 1: harvest mechanisation and volumes are well-documented by IOC and MAPA.

    phase_3:
      id: 3
      name: "Primary Processing"
      phase_category: "Midstream"
      physical_state_in: "Harvested olives in bulk bins (within 24-48 hours of picking)"
      physical_state_out: "Bulk EVOO or lampante-grade oil in tank; olive pomace and vegetation water (alpechin) as byproducts"
      primary_transformation: "Two-phase or three-phase decanter centrifuge extraction; cold extraction (below 27 C for EVOO grade)"
      typical_time_scale: "Continuous during 90-day harvest campaign; mill throughput 50-500 T/day"
      transparency_level: "Medium"
      measurable_output: "Litres EVOO produced; extraction rate %; byproduct volumes"
      output_unit: "L; %; T byproduct"
      data_status: "POPULATED"
      primary_sources:
        - "IOC: Spain milling infrastructure statistics"
        - "Dcoop: cooperative mill operations"
        - "MAPA: olive oil extraction data"
      opacity_score: 1
      key_values:
        number_of_mills_spain: "approximately 1750 (majority in Andalucia)"
        dcoop_storage_capacity_mt: 300000
        extraction_rate_pct: "18-22"
        evoo_grade_pct_of_production: "approximately 65 (recent years; higher in good crop quality years)"
        alpechin_byproduct: "Vegetation water: environmental liability historically; increasingly processed"
        pomace_valorisation: "Pomace oil extraction; biomass fuel for mill boilers"
      notes: >
        Andalucia has 1,750+ mills (majority of Spain's approximately 1,900 total), making it the
        world's largest olive oil processing infrastructure. Dcoop (Jaen) operates the world's
        largest cooperative olive oil facility with 300,000 MT storage, equivalent to 40% of a
        typical Spanish annual production. Mill efficiency is very high; modern two-phase decanters
        recover 97%+ of oil and produce less alpechin wastewater than older three-phase systems.
        The core limitation is that most output is stored in bulk tank at this phase, with no 
        differentiation by farm origin or harvest date, which prevents traceability and premium pricing
        downstream. The alpechin (olive vegetation water) is an environmental challenge, historically
        discharged to soils; its treatment and valorisation is improving but not universal.
        Opacity score 1: mill infrastructure and extraction rates are publicly reported by IOC/MAPA.

    phase_4:
      id: 4
      name: "Quality Certification"
      phase_category: "Midstream"
      physical_state_in: "Bulk EVOO in storage tank"
      physical_state_out: "Certified DOP/IGP product (minority) or uncertified commodity bulk (majority)"
      primary_transformation: "DOP/IGP analytical and sensory panel testing; organic certification audit; chemical composition verification"
      typical_time_scale: "Annual certification cycle; 3-5 years for new DOP entrants"
      transparency_level: "Low"
      measurable_output: "Tonnes DOP/IGP certified; number of certified producers"
      output_unit: "T; producers"
      data_status: "PARTIAL"
      primary_sources:
        - "MAPA: DOP and IGP registration data"
        - "Foods and Wines from Spain: Andalucia DOP profiles"
        - "IOC: certification statistics Spain"
      opacity_score: 2
      key_values:
        andalucia_dop_designations: "12 active (Sierra Magina, Baena, Priego de Cordoba, Estepa, Sierra de Segura, etc.)"
        dop_certified_share_pct: "approximately 8"
        uncertified_bulk_share_pct: "approximately 92"
        organic_certified_share_pct: "approximately 3"
        flos_olei_andalucia_entries: "Present but small fraction of production"
        certification_bottleneck: "Small cooperatives cannot afford DOP compliance costs; bulk system disincentivises traceability"
      notes: >
        Despite having twelve active DOP designations (more than any other Spanish region), Andalucia
        certifies only approximately 8% of its production through quality designation systems.
        The remaining 92% exits as uncertified commodity bulk. This is a structural paradox:
        Andalucia produces some of the world's highest-polyphenol olive oils (particularly from early-
        harvest Picual in Sierra de Segura and Priego de Cordoba) but the cooperative bulk system
        has no commercial mechanism to reward early-harvest, high-quality production above the standard
        commodity price. DOP certification costs are prohibitive for small cooperatives. The result
        is that premium quality is systematically destroyed at this phase: mixed with lower-grade oil
        in cooperative tanks, losing the traceability that would command EUR 8-25/L premium prices.
        The Olivares Vivos certification scheme is attempting to create a biodiversity-linked premium
        but covers only approximately 12,000 ha as of 2024.
        Opacity score 2: DOP volumes are public; uncertified bulk mixing within cooperative tanks is not.

    phase_5:
      id: 5
      name: "Market Distribution and Trade"
      phase_category: "Downstream"
      physical_state_in: "Bulk EVOO in tank (67%) or certified DOP/branded product (33%)"
      physical_state_out: "Revenue at cooperative or bottler gate; Spanish exports to global markets"
      primary_transformation: "Tank-to-tanker bulk export (Italy, USA, Japan as primary destinations) or domestic and export bottled retail"
      typical_time_scale: "Immediate to 18 months (storage and campaign timing)"
      transparency_level: "Low"
      measurable_output: "EUR export revenue; T exported; average price per kg"
      output_unit: "EUR; T; EUR/kg"
      data_status: "POPULATED"
      primary_sources:
        - "IOC: Spain export statistics 2023/24 (EUR 6.04B record, 742,500T)"
        - "IOC: Spain average export price EUR 3.22/kg vs Italy EUR 4.42/kg"
        - "Dcoop: bulk export structure"
        - "MAPA: olive oil trade statistics"
        - "Foods and Wines from Spain: export market profiles"
      opacity_score: 2
      key_values:
        spain_export_revenue_2023_24_eur: 6040000000
        spain_export_volume_t: 742500
        spain_avg_export_price_eur_per_kg: 3.22
        italy_avg_export_price_eur_per_kg: 4.42
        price_gap_eur_per_kg: 1.20
        estimated_annual_foregone_value_eur: 890000000
        bulk_export_share_pct: 67
        primary_importers: "Italy (repackaging), USA, Japan, Australia"
        italy_reimport: "Italy imports bulk Spanish oil, bottles under Italian brands, exports at premium"
      notes: >
        This is Andalucia's structural bottleneck phase. Spain exported 742,500 tonnes of olive oil
        in 2023/24 for a record EUR 6.04B, yet earns EUR 1.20/kg less than Italy on average.
        Because 67% of exports leave as unbranded bulk, Italy and other bottling destinations capture
        the brand premium. Dcoop is the largest single operator in the world yet sells commodity bulk.
        The estimated annual foregone brand premium is EUR 890M. This is not a production problem:
        Andalucia produces the world's best olive oil in terms of polyphenol content and volume.
        It is a value-chain positioning and brand investment failure that operates structurally: the
        cooperative system rewards volume over quality, and the small margin per kg for bulk leaves no
        surplus for the marketing investment that would allow brand differentiation at scale.
        Agrotourism is emerging (olive oil routes in Jaen and Cordoba provinces) but is nascent
        compared to Marina Alta's integrated PGI-agrotourism model.
        Opacity score 2: aggregate export data is public; individual cooperative pricing is private.

    phase_6:
      id: 6
      name: "Regenerative Transition"
      phase_category: "Downstream"
      physical_state_in: "Conventional monoculture grove; degraded soil; investment interest in transition"
      physical_state_out: "Cover-cropped, biodiversity-enhanced grove with improved soil biology and water retention"
      primary_transformation: "Introduction of cover crops; syntropic agroforestry understory; cessation of herbicides; Olivares Vivos certification pathway"
      typical_time_scale: "3-5 years to measurable soil improvement; 7-10 years to full biodiversity recovery"
      transparency_level: "Low"
      measurable_output: "Ha under regenerative management; % soil organic matter increase; bird species count recovery"
      output_unit: "ha; %; species count"
      data_status: "PARTIAL"
      primary_sources:
        - "Danyadara (Cadiz): syntropic agroforestry transition methodology"
        - "Olivares Vivos (Jaen): SEO/BirdLife and Univ. Jaen biodiversity monitoring"
        - "Regen Academy Spain: regenerative agriculture transition consulting"
        - "Huerta Pavon (Malaga): permaculture and edible understory in olive groves"
        - "Sarah Jones (CLARITY Coalition) research communication (2026-06-06)"
      opacity_score: 3
      key_values:
        danyadara_location: "Suryalila Retreat Centre, Cadiz province"
        danyadara_methodology: "Syntropic agroforestry; water retention earthworks; food forest establishment"
        olivares_vivos_enrolled_area_ha: 12000
        olivares_vivos_biodiversity_gain: "Recovery toward reference biodiversity levels within 3-5 years"
        cover_crop_moisture_retention_gain_pct: "20-35 in first 3 years"
        transition_yield_drop_year_1: "10-25% (conventional farmers cite as main barrier)"
        regen_academy_services: "On-the-ground project design for transition away from agrochemicals"
      notes: >
        The regenerative transition is the most analytically important emerging phase in Andalucia
        because it directly addresses the Phase 0 (Ecosystem Baseline) failure: soil biology
        restoration. Danyadara (Cadiz), based at the Suryalila Retreat Centre, specialises in
        reversing desertification in Andalucia using syntropic agroforestry and water-retention
        landscape techniques. Their approach: intercrop vegetables, medicinal plants, and diverse
        shrubs between olive rows; eliminate herbicides; build soil organic matter and microbial life.
        Olivares Vivos (Jaen, led by Univ. Jaen and SEO/BirdLife) provides the scientific monitoring
        backbone: enrolled farms show rapid biodiversity recovery, which supports a certification
        premium. The critical barrier is the year-one yield drop (10-25%) that discourages conventional
        farmers. This transition phase has no financial instrument supporting it: no Spanish equivalent
        to EU Horizon Climate Adaptation funding has been deployed for this purpose at scale.
        Opacity score 3: transition programs are documented but not systematically tracked at national level.

    phase_7:
      id: 7
      name: "Ecosystem Restoration"
      phase_category: "Downstream"
      physical_state_in: "Eroded slopes; degraded Guadalquivir watershed; biodiversity-depleted olive landscape"
      physical_state_out: "Stabilised soils; recovered watershed function; measurable biodiversity return"
      primary_transformation: "Landscape-scale erosion control; riparian restoration; cover crop establishment at watershed scale; Guadalquivir flow management improvement"
      typical_time_scale: "Decades (watershed recovery); 5-10 years (measurable soil stabilisation)"
      transparency_level: "Low"
      measurable_output: "T/ha/yr erosion reduction; ha under cover crops; Guadalquivir flow improvement metrics"
      output_unit: "T/ha/yr; ha; flow metrics"
      data_status: "OPAQUE"
      primary_sources:
        - "CHG Guadalquivir Basin Authority: watershed management plan"
        - "Olivares Vivos: biodiversity monitoring programme"
        - "MAPA: national soil erosion monitoring (INES)"
        - "SEO/BirdLife: Andalucia landscape-scale biodiversity targets"
      opacity_score: 4
      key_values:
        restoration_funding_available: "No dedicated national programme at scale as of 2026"
        eu_green_deal_linkage: "Potential under EU Soil Strategy 2030; not yet operationalised"
        guadalquivir_restoration_plan: "CHG working plan; underfunded"
        olivares_vivos_scale_target: "100,000 ha by 2030 (current: 12,000 ha)"
        erosion_reduction_with_cover_crops: "70-90% reduction achievable within 5 years"
      notes: >
        Ecosystem restoration at Andalucia scale is the most opaque and underfunded phase. Unlike
        Marina Alta where the governance problem (CASAMA reactivation) is the primary lever and the
        physical hydrology is favourable, Andalucia needs physical soil rebuilding before governance
        improvements have leverage. The Guadalquivir is one of Spain's most water-stressed river systems
        (2.5 km3 annual deficit in recent drought years) and its agricultural demand is dominated by
        the olive sector. No national-scale restoration programme equivalent to the EU Horizon Climate
        Adaptation framework has been deployed for Andalucia olive landscape specifically. Olivares
        Vivos has a 2030 target of 100,000 ha (from current 12,000 ha) which would represent
        approximately 5.5% of Andalucia olive area. The EU Soil Strategy 2030 provides a framework
        but its implementation regulations are not yet operationalised for olive monoculture landscapes.
        This is the lowest-balance phase in the Andalucia chain and the primary investment opportunity.
        Opacity score 4: no systematic national monitoring of restoration progress; Guadalquivir
        watershed data is public but farm-level restoration is entirely voluntary and untracked.

