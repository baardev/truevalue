id: marina_alta
name: Marina Alta Mountain Ecosystem
type: standalone_hub
service_category: provisioning, regulating, cultural
description: >
  Multi-commodity climate adaptation ecosystem in the Alicante Mountains, Spain.
  Anchor commodity: Cerezas de la Montana de Alicante (PGI cherry). Secondary
  commodities: premium EVOO (Masia el Altet, Senorios de Relleu), almonds (recovery
  from Xylella fastidiosa), and replacement crops (pistachios, carob, modern almonds).
  8 analytical phases from ecosystem baseline through crop transition and aquifer
  regeneration. Critical case study for EU Horizon Climate Change Adaptation funding.
created: "2026-06-06"
