id: tholonic_ai
name: Tholonic Neural Architecture
type: research_hub
description: >
  Three subprojects applying the tholonic N-D-C framework to neural networks.
  The visualization subproject renders inference as a progressive 4-phase supply chain
  (expansion, scaling, equilibrium, compression). The empirical subproject measures
  tholonic constants at data-driven phase boundaries across 14 models in 6 architecture
  families, achieving a 78% pass rate above the pre-registered 67% threshold. The
  experimental subproject will test the tholonic balance regularizer in a training run.
paper: docnav/Research/papers/10_tholonic-neural-architecture.md
primary_paper: >
  Milton, J.W. (2026). Neural Networks as Tholonic Systems: A Structural Framework
  for Architecture, Scaling, and Alignment-by-Design. Clarity Coalition.
theoretical_framework: Tholonic Model (N-D-C triad)
subprojects:
  visualization:
    - inference_supply_chain
  empirical:
    - phi_ratio_measurement
  experimental:
    - tholonic_regularizer_training
pilot_subproject: inference_supply_chain
key_predictions:
  - "At data-driven detected phase boundaries, norm ratios match a tholonic constant (φ, ln2, e, √2) within 8% at ≥67% of boundaries, with each constant in its theoretically predicted role — RESULT: 78% (51/65) across 14 models, 6 families ✓"
  - "R2 = ‖logits‖/‖h_L‖ follows (ln2)^k within 8% across diverse well-trained architectures"
  - "φ-deviation at R1 correlates negatively with training quality (Spearman r < -0.55)"
  - "Tholonically-balanced networks converge faster than matched unbalanced networks (untested)"
  - "Tholonic constraint reduces reward hacking in RLHF (untested)"
empirical_results:
  data_driven_phase_detection:
    overall_pass_rate: "78% (51/65)"
    models_tested: 14
    families_tested: 6
    threshold: "67%"
    verdict: "PASSES"
    constant_scorecard:
      phi: 20
      sqrt2: 16
      ln2: 13
      e: 2
  phase_structure:
    phases: 4
    transitions:
      expansion: "e (early layers, 0-1)"
      scaling: "√2 (early-mid layers)"
      equilibrium: "φ (mid-network)"
      compression: "ln2 (final layers → logits)"
created: "2026-05-23"
last_updated: "2026-05-24"
