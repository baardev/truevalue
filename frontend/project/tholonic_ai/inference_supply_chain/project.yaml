id: inference_supply_chain
name: Inference as a Supply Chain
parent: tholonic_ai
type: visualization
description: >
  Interactive visualization of neural network inference as a progressive entropy-reducing
  supply chain across N-D-C scopes. Shows two tracks side by side: a C-dominant AI and a
  tholonically-balanced AI, both given the same objective (maximize user engagement).
  Based on paper Sections 5a, 6, and Table 10.6.
key_insight: >
  Each layer of a neural network performs the same N-D-C operation on an increasingly
  narrow scope. This is structurally identical to a commodity supply chain: raw material
  becomes finished product through successive stages, each reducing entropy. The critical
  difference between a C-dominant and a tholonic architecture is visible at every stage:
  in the C-dominant system, the D-sublayer is absent after the first stage; in the tholonic
  system, D-C balance is maintained throughout.
scenario: >
  Both tracks receive the same objective: "Maximize user engagement on this platform."
  This is the real-world objective given to deployed recommendation systems, whose
  downstream effects (polarization, addiction, misinformation amplification) have been
  extensively documented.
paper_sections:
  - "Section 5: The N-D-C Mapping to Neural Networks"
  - "Section 5a: Why Neural Networks Are Structurally Self-Similar"
  - "Section 6: The Supply Chain Framing — Inference as Progressive Entropy Reduction"
  - "Section 10.6: The Decision Supply Chain (C-dominant vs. Tholonic)"
stages:
  - id: input
    name: Input
    scope: maximally diffuse
    entropy: 1.00
  - id: early
    name: Early Layers
    scope: edge/pattern detection
    entropy: 0.72
  - id: middle
    name: Middle Layers
    scope: behavioral pattern recognition
    entropy: 0.45
  - id: late
    name: Late Layers
    scope: policy commitment
    entropy: 0.22
  - id: output
    name: Output
    scope: fully committed policy
    entropy: 0.04
created: "2026-05-23"
