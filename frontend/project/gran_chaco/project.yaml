bond_relevance: >
  The soy and beef supply chains are directly exposed to EUDR compliance risk. A
  sustainability-linked bond (SLB) structure would use deforestation rate KPIs as
  performance triggers: a borrower failing to maintain deforestation-free sourcing
  (as verified by isotopic traceability or satellite monitoring) pays a step-up rate.
  Phase 2 transparency is the binding constraint: until aggregation-point mixing can
  be resolved, KPI verification is unreliable. A green bond could directly finance
  isotopic fingerprinting infrastructure and disaggregated Sio-granos data disclosure.
