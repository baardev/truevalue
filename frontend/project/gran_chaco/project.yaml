id: gran_chaco
name: Gran Chaco — Soy, Beef & Forest Ecosystem Services
type: multi_chain
service_category: provisioning
teeb_class: provisioning
description: >
  The Gran Chaco is a 107 million hectare dry forest and savanna spanning Argentina
  (65 Mha, 60.4%), Paraguay (30 Mha, 28%), Bolivia (12 Mha, 11.4%) and Brazil (140,000 ha,
  0.1%) — the second-largest forest system in South America after the Amazon and the
  largest dry forest in South America. Soy and beef production have driven the loss of
  more than 10 million hectares in Argentina alone since 1985, with 149,649 ha deforested
  in 2024. Deforestation emitted approximately 20,875 GgC per year across Argentina
  (1996-2005), of which 75% originated in the Gran Chaco. Only 9% of the Argentine Chaco
  (5.87 Mha) is formally protected. Soil erosion has reduced original soil cover by 40-60%
  in the Chaco-Salteño region. Argentina also serves as a regional soy processing hub,
  with 62 Mt/year crushing capacity at Rosario. The EU Deforestation Regulation (EUDR,
  1115/2023) increases compliance pressure on soy cake importers, but the Chaco biome
  currently falls outside EUDR scope due to its canopy cover structure. This project
  models the soy supply chain through 5 phases and identifies Phase 2 (Aggregation and
  Transport) as the structural bottleneck for deforestation-free certification and
  sustainability-linked bond KPI verification.
supply_chains:
  - id: soy
    status: active
    description: "Soy supply chain: land conversion through EUDR export compliance. 5 phases."
  - id: beef
    status: deferred
    description: "Beef supply chain: pasture establishment through export. 33% of Argentine cattle stock from Gran Chaco."
  - id: ecosystem_services
    status: deferred
    description: "Forest ecosystem services: carbon sequestration, water regulation, biodiversity. Bond covenant layer."
