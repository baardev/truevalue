    countries: [Argentina, Paraguay, Bolivia, Brazil]
    total_chaco_ha: 107000000
    argentina_chaco_ha: 65000000
    argentina_share_pct: 60.4
    paraguay_chaco_ha: 30000000
    bolivia_chaco_ha: 12000000
    brazil_chaco_ha: 140000
    chaco_seco_ha: 49298000
    chaco_humedo_ha: 11850000
    key_provinces: [Santiago del Estero, Chaco, Formosa, Salta, Jujuy]
    soy_area_ha: 2700000
    primary_export_hub: Rosario (Santa Fe Province)
    transport_corridor: Hidrovía Paraná/Paraguay river system

  infrastructure_parameters:
    crushing_capacity_mt_per_year: 62000000
    crushing_utilisation_pct: 60
    primary_processing_hub: Rosario
    annual_soy_production_chaco_mt: 7750000
    annual_soy_exports_2019_mt: 26000000
    soy_cake_exports_eu_mt_2019: 9400000
    paraguay_import_share_pct: 82
    annual_imports_mt: 5000000
    trader_concentration_top12_pct: 88
    deforestation_2024_ha: 149649
    deforestation_2023_ha: 134700

  supply_chain_phases:
    phase_0:
      id: 0
      name: "Land Conversion & Farm Establishment"
      phase_category: Upstream
      physical_state_in: "Native dry forest and woodland — Chaco biome"
      physical_state_out: "Cleared agricultural land ready for soy cultivation"
      primary_transformation: "Woodland clearance, land title registration or occupation, soil preparation"
      typical_time_scale: "1 to 5 years (land clearing to first productive harvest)"
      transparency_level: Low
      measurable_output: "Cultivated hectares in soy production"
      output_unit: "ha"
      data_status: PARTIAL
      primary_sources:
        - "Greenpeace Argentina deforestation monitoring (2025) — annual forest loss by province"
        - "Global Forest Watch — satellite-based canopy cover change"
        - "CONICET / UMSEF — national forest inventory"
      opacity_score: 3
      key_values:
        soy_area_chaco_ha: 2700000
        forest_cleared_2024_ha: 149649
        provinces_most_affected: "Santiago del Estero, Chaco, Formosa, Salta"
        deforestation_driven_by_soy_ha_2019: 37000
        # Ecosystem service costs of land conversion (Paruelo et al. 2009)
        co2_emissions_argentina_deforestation_ggc_per_yr: 20875
        co2_from_gran_chaco_pct: 75
        co2_from_gran_chaco_ggc_per_yr: 15656
        soil_cover_loss_chaco_salteno_pct: "40-60"
        # Protected area context (Vida Silvestre)
        total_chaco_protected_ha: 5874474
        protected_area_pct_of_argentine_chaco: 9
      notes: >
        Opacity score 3/4: Individual farm-level clearance is not publicly disclosed. National
        and provincial aggregate data available from UMSEF and Greenpeace, but linking specific
        parcels to downstream traders and export volumes requires proprietary data. Land title
        disputes, illegal clearing and manipulation of provincial forest zoning maps are documented.
        Cattle ranching often precedes soy as an intermediate step, masking the direct commodity
        driver. EUDR cut-off date is 31 December 2020; pre-existing cleared land after that date
        is non-compliant but attribution requires plot-level traceability which does not currently
        exist in publicly disclosed form.

        Ecosystem service cost of Phase 0 (Paruelo et al. 2009): each hectare of Chaco cleared
        contributes to Argentina's deforestation CO2 emissions, which averaged 20,875 GgC/year
        over 1996-2005, with 75% (approx. 15,656 GgC/year) attributable to the Gran Chaco.
        Water regulation services are already degraded — higher evaporation rates and groundwater
        contamination by agrochemicals. Soil erosion (wind and water) has reduced original soil
        cover by 40-60% in the Chaco-Salteño region. Only 9% of the Argentine Gran Chaco
        (5.87 Mha) is formally protected, which means 91% remains exposed to conversion risk.
        These unquantified ecosystem service losses represent the natural capital cost embedded
        in Phase 0, which is not reflected in the commodity price of soy.

    phase_1:
      id: 1
      name: "Cultivation & Harvest"
      phase_category: Upstream
      physical_state_in: "Agricultural land prepared for planting"
      physical_state_out: "Harvested raw soybean — dried seed at farm gate"
      primary_transformation: "Primary crop production: planting, soil management, irrigation (limited), harvest"
      typical_time_scale: "Annual crop cycle: October to May (southern hemisphere)"
      transparency_level: Medium
      measurable_output: "Tonnes of raw soybean at farm gate"
      output_unit: "tonnes"
      data_status: POPULATED
      primary_sources:
        - "USDA Soybean Explorer — national and sub-national production data"
        - "INDEC (Argentina) — agricultural census and production statistics"
        - "Bolsa de Cereales (Buenos Aires) — crop forecasts and production estimates"
      opacity_score: 2
      key_values:
        soy_production_chaco_mt_per_year: 7750000
        yield_kg_per_ha: 2800
        planting_area_chaco_mha: 2.7
        argentina_total_production_mt_2023: 50000000
      notes: >
        Opacity score 2/4: National and provincial production aggregates are reliable and
        publicly available from USDA and INDEC. However, farm-level provenance data (which
        specific parcels contributed to which volumes) is not publicly disclosed. Certified
        volumes (RTRS Round Table on Responsible Soy) cover less than 1% of Paraguayan
        volumes; Argentine certified volumes also remain a small fraction. Isotopic and
        elemental fingerprinting (Maor et al. 2026) now enables sub-200 km origin
        determination, providing a potential route to farm-level traceability without
        full information disclosure.

    phase_2:
      id: 2
      name: "Aggregation & Inland Transport"
      phase_category: Midstream
      physical_state_in: "Raw soybean from multiple farms and origins"
      physical_state_out: "Mixed soybean at crushing facility or export port"
      primary_transformation: "Collection at local silos, mixing of origins, transport along the Hidrovía Paraná/Paraguay to Rosario"
      typical_time_scale: "Days to weeks (logistics and storage cycles)"
      transparency_level: Low
      measurable_output: "Tonnes of soybean delivered to crushing hubs"
      output_unit: "tonnes"
      data_status: PARTIAL
      primary_sources:
        - "Sio-granos (AFIP/Argentina) — grain movement data, aggregated by zone"
        - "Trase Earth — trader-level supply chain attribution methodology"
        - "Hidrovía Paraná/Paraguay port data (public aggregates)"
      opacity_score: 3
      key_values:
        paraguay_import_share_pct: 82
        annual_imports_to_argentina_mt: 5000000
        hidrovía_transport_share_pct: 70
        zone_aggregation_level: "Departmental zones (several departments per zone)"
      notes: >
        Opacity score 3/4: This is the critical bottleneck phase. Soybeans from multiple farms
        and multiple countries (primarily Paraguay — 82% of imports) are physically mixed at
        local silos and transport nodes before arriving at Rosario crushing facilities. Sio-granos
        tracks grain movements within Argentina but only in aggregated zone-level form in its
        public release; individual farm-to-silo-to-crusher flows are not disclosed. International
        imports are tracked at the border but not at the sub-shipment level. Once beans are mixed
        at a collection centre the provenance chain is broken, making deforestation-free
        certification and EUDR due diligence verification impossible without isotopic fingerprinting
        or disaggregated data from traders. Twelve traders control 88% of Gran Chaco soy exports,
        suggesting that voluntary disclosure by a small number of firms could substantially
        improve chain transparency.

    phase_3:
      id: 3
      name: "Crushing & Processing"
      phase_category: Midstream
      physical_state_in: "Mixed raw soybean delivered to crushing facility"
      physical_state_out: "Soy cake (protein meal) and soy oil — separated processed products"
      primary_transformation: "Industrial separation into soy cake (~80% by weight) and soy oil (~20%)"
      typical_time_scale: "Hours to days (industrial processing)"
      transparency_level: High
      measurable_output: "Tonnes of soy cake and soy oil"
      output_unit: "tonnes"
      data_status: POPULATED
      primary_sources:
        - "Bolsa de Cereales — crushing utilisation, capacity, and throughput"
        - "USDA — Argentina crushing capacity and utilisation rates"
        - "CIARA (Cámara de la Industria Aceitera de la República Argentina)"
      opacity_score: 1
      key_values:
        crushing_capacity_mt: 62000000
        capacity_utilisation_pct: 60
        rosario_hub_share_pct: 80
        soy_cake_output_mt_2019: 26000000
        soy_oil_output_mt_2019: 6500000
      notes: >
        Opacity score 1/4: Argentina's crushing sector is well-documented. The Rosario hub
        (Santa Fe Province) accounts for approximately 80% of national crushing capacity and
        is operated by major international grain traders (Bunge, Cargill, Louis Dreyfus, ADM,
        Viterra) who report volumes to CIARA and the Bolsa de Cereales. However, crushing
        capacity utilisation fell from ~65% to ~57% in 2020 as domestic production declined,
        making imports from Paraguay critical to fill capacity. The deforestation signal from
        Phase 0-2 is embedded in the crushed product but undetectable at this stage without
        upstream traceability.

    phase_4:
      id: 4
      name: "Export & EUDR Compliance"
      phase_category: Downstream
      physical_state_in: "Processed soy products at Rosario and Buenos Aires port terminals"
      physical_state_out: "Soy cake and oil exported to EU, Asia, and other markets"
      primary_transformation: "Port handling, custom documentation, due diligence declaration under EUDR"
      typical_time_scale: "Weeks to months (export logistics and certification)"
      transparency_level: Medium
      measurable_output: "Tonnes of soy products exported with origin declaration"
      output_unit: "tonnes"
      data_status: PARTIAL
      primary_sources:
        - "INDEC Comex (Argentina) — export volumes by product and destination"
        - "UN Comtrade — bilateral trade flows"
        - "EUDR compliance requirements (Regulation 1115/2023)"
        - "Trase Earth — trader attribution to export volumes"
      opacity_score: 2
      key_values:
        eu_soy_cake_imports_mt_2019: 9400000
        china_soybean_imports_mt_2021: 4700000
        india_oil_imports_mt_2021: 4200000
        eudr_chaco_coverage: "Excluded — Chaco biome canopy cover < 10% EUDR threshold"
        trader_zdc_coverage_pct_2019: 55
      notes: >
        Opacity score 2/4: Export volumes and destinations are publicly tracked. However,
        EUDR compliance for soy cake from Argentina is complicated by two issues. First,
        the Chaco biome is currently excluded from EUDR scope because its canopy cover
        structure (dry forest with <10% dense canopy) falls below the regulation's forest
        definition threshold — a critical policy gap documented in Maor et al. (2026).
        Second, even where EUDR applies (e.g. for Cerrado-adjacent soy), provenance
        verification relies on geolocation declarations that may be falsified, as the Maor
        et al. GP model was explicitly designed to check. 55% of 2019 soy volume exported
        was covered by a trader with a zero-deforestation commitment (ZDC), up from 30%
        in 2016 — positive trend but still leaving 45% uncovered.

  ndc_derivation:
    phase_0: {D: 244, C: 324, balance: 75.3, N: 212, sustainability: 1.6}
    phase_1: {D: 260, C: 310, balance: 83.9, N: 238, sustainability: 4.0}
    phase_2: {D: 220, C: 350, balance: 62.9, N: 175, sustainability: 0.6}
    phase_3: {D: 300, C: 330, balance: 90.9, N: 286, sustainability: 11.0}
    phase_4: {D: 260, C: 280, balance: 92.9, N: 251, sustainability: 24.4}

  coherence_scores:
    pi: 81.2    # Chain average balance — operational coherence
    phi: 72.0   # Value distribution efficiency — heavy intermediation from mixing
    sqrt2: 68.0 # Structural overhead from multi-origin aggregation
    ln2: 75.0   # Value transformation: raw bean to processed cake/oil
    e: 0        # Financial abstraction (CBOT futures, financing) — deferred

  analyst_notes: |
    The Gran Chaco soy supply chain scores A+ at 81.2% chain average balance, but
    this aggregate masks a severe bottleneck at Phase 2 (Aggregation and Inland
    Transport, 62.9% balance — Poor). The structural cause is information asymmetry:
    physical commingling of beans from multiple origins (domestic Chaco soy +
    Paraguayan imports + Brazilian imports) breaks the provenance chain at collection
    centres, making it impossible to verify whether specific export volumes are
    deforestation-free.

    The D-C imbalance at Phase 2 reflects the system's structural character: Contribution
    (C=350) — the integrative force pulling in volumes from multiple countries via the
    Hidrovía river system — far exceeds Definition (D=220) — the boundary-setting and
    verification mechanisms that would constrain which volumes are admissible. The
    chain absorbs material efficiently but cannot govern its origin.

    Ecosystem service cost (Paruelo et al. 2009): deforestation in the Argentine Gran Chaco
    contributed approximately 15,656 GgC/year to Argentina's CO2 budget (1996-2005 average),
    representing 75% of Argentina's total deforestation emissions. This carbon cost is not
    priced into the commodity at Phase 0. Soil erosion from cleared land has reduced original
    soil cover by 40-60% in Chaco-Salteño, and water regulation services are already
    degraded. A carbon bond or REDD+ instrument targeting Phase 0 would need to price this
    externality in order to make deforestation-free land use economically competitive.

    Bond opportunity: A sustainability-linked bond (SLB) targeting Phase 2 transparency
    would use as performance KPIs: (1) annual deforestation rate in key soy-producing
    departments of the Chaco, verified by satellite (Global Forest Watch); (2) percentage
    of export volume covered by a zero-deforestation commitment; (3) disaggregated
    Sio-granos data made available to third-party auditors. A step-up rate of 25 bps per
    KPI missed would align financial incentives with deforestation-free sourcing.

    A green bond tranche could directly finance: (1) deployment of the Maor et al. (2026)
    isotopic fingerprinting infrastructure at Rosario crushing hubs; (2) disaggregated
    data disclosure from the twelve traders controlling 88% of Gran Chaco soy exports;
    (3) EUDR advocacy to extend coverage to the Chaco and Cerrado biomes.
