pdi:
  material: "Gran Chaco soy"
  analyst: "Jeffrey W. Milton / Clarity Coalition"
  date_completed: "2026-05-27"
  service_type: human
  basin: gran_chaco
  paired_with:
    natural: ecosystem_services
    hub: gran_chaco
  hub: gran_chaco

  sources_overview: |
    1. Trase Earth: Argentina soy supply chain data 2015-2021, trader concentration, deforestation
       attribution. https://trase.earth/insights/argentina-the-overlooked-hub-of-south-american-soy
    2. Maor et al. (2026) — High-resolution soybean tracing for deforestation-free supply chains.
       Nature Communications Earth & Environment 7:310. doi:10.1038/s43247-026-03380-8
    3. WEF Gran Chaco Pathways Towards a Sustainable Future (2025).
       https://reports.weforum.org/docs/WEF_The_Gran_Chaco_Pathways_Towards_a_Sustainable_Future_2025.pdf
    4. Planet Tracker — Chaco Landowner Report (2022).
       https://planet-tracker.org/wp-content/uploads/2022/03/Gran-Chaco-LD-report.pdf
    5. Greenpeace Argentina — Gran Chaco deforestation data 2024.
    6. USDA Soybean Explorer (2024). Production, exports, crushing capacity.
    7. Bolsa de Cereales (Argentina) — crushing utilisation data.
    8. Paruelo J. et al. (2009) — Elementos conceptuales y metodológicos para la Evaluación de
       Impactos Ambientales Acumulativos (EIAAc) en bosques subtropicales. El caso del este de
       Salta. Key data: Argentine CO2 from deforestation = 20,875 GgC/yr (1996-2005); 75% from
       Gran Chaco = ~15,656 GgC/yr; soil erosion 40-60% reduction in Chaco-Salteño; water
       regulation disruption and groundwater pollution.
    9. Fundación Vida Silvestre Argentina / WWF — Gran Chaco Ecoregion.
       https://granchaco.vidasilvestre.org.ar/
       Total area 107 Mha; country breakdown; protected area data (9% protected, 5.87 Mha);
       4 Ramsar sites; 1 Biosphere Reserve; 12 national parks.

  geographic_scope:
