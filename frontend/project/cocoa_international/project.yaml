id: cocoa_international
name: Cocoa — Global Supply and Value Chain
type: standalone
service_category: provisioning
teeb_class: provisioning
description: >
  Cocoa is one of the world's most geographically concentrated commodity chains. Ivory Coast
  produces approximately 2.2 million tonnes per year (45% of global supply) and Ghana another
  800,000 tonnes (16%), giving West Africa a combined 60%+ share. The chain spans 7 phases
  from cultivation through manufacturing and retail. The defining structural failure is at
  Phase 1 (Fermentation and Drying): the most value-defining transformation in the chain
  occurs at the farm level with virtually no traceability, no custody documentation, and
  widespread child labor risk. Sustainability certifications (UTZ, Rainforest Alliance, Fairtrade)
  operate downstream of this opacity and cannot verify the practices they claim to certify.
  Ivory Coast has deliberately shifted approximately 700,000-800,000 tonnes per year of
  processing to domestic origin (35% of its harvest), a strategic policy shift that is
  restructuring the global value distribution. The Netherlands (Amsterdam) remains the
  largest single destination grinding hub at approximately 600,000 tonnes per year.
  The global cocoa market is valued at approximately USD 13 billion and is central to EU
  Deforestation Regulation (EUDR) compliance obligations for imported finished products.
