bond_relevance: >
  The cocoa global supply chain offers two sustainability-linked bond structures:
  (1) a traceability and child-labor-free SLB tied to Phase 1 (Fermentation/Drying)
  custody verification KPIs, using CLMRS (Child Labor Monitoring and Remediation System)
  enrollment rates and geolocation polygon coverage as trigger metrics; and
  (2) a deforestation-free sourcing bond tied to EUDR compliance KPIs, using verified
  cocoa volume as a share of total procurement as the performance anchor. Both bond
  structures are directly constrained by Phase 1 opacity (balance 76.5%), which is the
  binding structural bottleneck preventing verifiable KPI measurement.
