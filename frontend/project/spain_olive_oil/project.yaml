id: spain_olive_oil
name: Olive Oil — Spanish Supply and Value Chain
type: standalone
service_category: provisioning
teeb_class: provisioning
description: >
  Spain produces approximately 45-51% of global olive oil output from 2.5 million hectares
  and 340 million trees, concentrated in Andalusia (75%) and especially Jaen province.
  The supply chain spans 8 phases from grove cultivation through international trade, involving
  over 380,000 farms, 1,755 mills, 1,500 bottlers, and 22 refineries. The structural bottleneck
  is Phase 5 (Packaging/Bottling): approximately two-thirds of exports leave Spain in bulk at
  EUR 3.22/kg average, then are repackaged and resold by Italian brands at EUR 4.42/kg, costing
  Spanish producers approximately EUR 1.20/kg in foregone brand premium on over 700,000 tonnes
  annually. The market reached a record EUR 6.04 billion in export revenues in 2023/24 despite
  near-drought conditions. Climate volatility (48% production drop in 2022-23), price volatility
  (EUR 3.50/L in 2021 to EUR 6.20/L in 2023), and supply chain fragmentation are the primary
  systemic risks. Italy is the leading destination (28.2%), followed by USA (now >EUR 1B) and France.
