bond_relevance: >
  The olive oil supply chain offers two sustainability-linked bond structures:
  (1) a producer-level SLB tied to climate resilience KPIs (irrigation efficiency, drought-resistant
  variety adoption, water recycling rate in mills) for Andalusian cooperatives seeking to maintain
  output through climate volatility; and (2) a value chain bond tied to brand development KPIs
  (share of bottled vs bulk exports, PDO-certified volume growth, direct-to-consumer revenue share)
  to close the EUR 1.20/kg premium gap currently lost to Italian rebranding. Phase 5 bottleneck
  (Packaging/Bottling: balance 81.1%) is the binding constraint for both bond structures.
