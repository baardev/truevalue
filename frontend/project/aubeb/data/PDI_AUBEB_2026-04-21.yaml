         scores of 3–5 and defined B11 outputs, meeting the formal criteria. The 11-phase structure
         reflects the genuine complexity of this chain, which spans financial, ecological, and
         governance transformations not present in conventional commodity supply chains.

      2. DUAL COMMERCIALISATION PHASES (5 and 6):
         Phases 5 and 6 are both classified as Commercial with no process class change at their
         boundary (B6=false for Event 6). This is structurally unusual — two consecutive phases
         of the same class. The distinction is real and justified: Phase 5 delivers value out to
         market; Phase 6 returns capital back to the ecosystem. They are opposite-direction flows
         of the same commercial mechanism, not two iterations of the same event.

      3. EXTRACTIVE CLASSIFICATION FOR RESTORATION (Phase 9):
         Classifying Phase 9 (active ecosystem recovery) as Extractive (B5) is the most
         counterintuitive assignment in this PDI. The rationale from the source document — that
         degradation pressure is being "extracted" from the system — is coherent within the
         material-agnostic framework but should be flagged for review when the PDI protocol is
         applied to other restoration supply chains. An alternative classification of Custodial
         (with facilitated natural process) may be more consistent across chain types.

      4. AFRICAN SEED BANK (sub-process):
         Currently classified as a sub-process within Phases 7 and 8 because no confirmed
         measurable output at programme level exists. Recommend elevation to Phase status
         (new Phase 8b or Phase 7.5) if formal establishment occurs with defined governance,
         species inventory, and output protocols.

      5. MULTI-VALUE OUTPUT STREAM (Phase 10):
         The standard child_n_output field assumes a single primary output unit. Phase 10
         simultaneously produces four verified output streams (carbon, fisheries, livelihoods,
         NDC). The multi_value_outputs field was added to the YAML schema to capture this.
         The Abstract Supply Chain Phase Template will need a corresponding update if
         multi-value phases are to be modelled.

      6. TVPCI INTEGRATION:
         TVPCI baseline is computed at Phase 4 and milestone achieved at Phase 10. The
         tvpci_notes field was added per phase. Phases 5 and 6 are the commercial phases
         whose terms the TVPCI tracks against the Phase 4 structural quality baseline.

      7. GUD ROLE CLARIFICATION:
         GUD is a co-developer and technical services provider across Phases 2, 3, 6, 7, and 9.
         GUD is explicitly NOT a bond counterparty. This distinction is important for legal
         and financial structuring documentation derived from this PDI.

