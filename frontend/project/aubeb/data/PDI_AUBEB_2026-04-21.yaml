  # ----------------------------------------------------------
  # MODULE 1 — Anchor the Chain
  # ----------------------------------------------------------

  module_1:

    A1_origin_state: |
      Degraded and threatened mangrove ecosystems occupying the coastlines of seven African
      Union member states, before any conservation intervention, measurement framework, or
      financing structure. The material exists as living but functionally compromised coastal
      forest, with continuing net loss driven by fuelwood extraction, agricultural conversion,
      urban expansion, oil extraction (Nigeria and Cameroon), and cyclone damage.

      Physical condition at origin — a mosaic of land cover classes across the 150,000-hectare
      programme envelope:
        LC-01: Intact native mangroves — continuous canopy, functioning hydrology.
        LC-02: Degraded mangroves — native species present but thinned or disturbed.
        LC-03: Converted and severely degraded areas.
        LC-04: Carbon-rich intertidal sediments and peaty soils (75–90% of total ecosystem
               carbon stock).
        LC-05: Settlements and infrastructure — excluded from carbon accounting but mapped
               for leakage management.

      Ecosystem carbon stock at origin by country (sediment organic carbon, top 1 m):
        Nigerian Delta intact systems: >2,500 Mg CO2e/ha; sediment 622–640 Mg C/ha.
        Cameroon Douala Estuary: 500–800 Mg C/ha.
        Mozambique intertidal: 450–600 Mg C/ha.
        Madagascar: 450–600 Mg C/ha.
        Guinea: 500–700 Mg C/ha.
        Tanzania: 400–600 Mg C/ha.
        Benin: 300–500 Mg C/ha.

      Without-project baseline emissions: approximately 6.5–10.4 MtCO2e/year at programme level.

      Biodiversity: at least 17 mangrove tree species; nursery grounds for >1,500 species of
      fish, birds, and mammals. Up to 80% of commercial fish biomass in West Africa is
      mangrove-dependent. Approximately 1.5 million coastal dwellers depend directly on
      these ecosystems.

    A2_market_state: |
      A restored, protected, and measurably verified mangrove blue economy asset:
      150,000 hectares of mangrove ecosystem across seven countries, generating independently
      verified outputs across four value streams simultaneously:

        1. Verified carbon sequestration: net annual sequestration of approximately 5.64 million
           tCO2e/year after 20% non-permanence buffer, registered under an internationally
           recognised carbon standard (Verra VM0007/VM0033, Gold Standard, Plan Vivo, ICR, or ACR)
           and held on the corresponding standards registry.
        2. Recovered fisheries and coastal protection: measurably improved fisheries yields,
           biodiversity recovery, and coastal protection for over 1.5 million coastal dwellers.
        3. Community blue economy livelihoods: documented income from fisheries, benefit-sharing,
           women and youth employment.
        4. Sovereign NDC fulfilment: integration of restoration outcomes into nationally
           determined contributions.

      The financial mechanism (AUBEB bond) is a commercialisation-phase instrument, not the
      end state. The end state is the restored ecosystem and its sustained multi-value outputs.

    A3_origin_unit: "Hectares of mangrove ecosystem by land cover class (LC-01 through LC-04); Mg C/ha for carbon stock; MtCO2e/yr for baseline emissions; species presence indices for biodiversity"
    A4_market_unit: "Verified tCO2e/year (net of buffer) on standards registry; hectares restored and protected (ODIN dMRV verified); fisheries productivity index; community livelihood metrics (households, women and youth employment figures); NDC contribution (confirmed by host government)"

    A5_unit_changes: true
