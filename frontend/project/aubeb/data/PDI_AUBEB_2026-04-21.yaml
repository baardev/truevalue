  # ----------------------------------------------------------
  # MODULE 3 — Boundary Scoring and Phase Map
  # ----------------------------------------------------------

  module_3:

    phase_map:
      - phase: 0
        name: "Pre-commercial: degraded ecosystem at origin"
        begins_at_event: null
        ends_at_event: 1
        child_n_output: "150,000 ha across 7 countries; baseline emissions 6.5–10.4 MtCO2e/yr; biodiversity baseline"

      - phase: 1
        name: "Custodial formalisation — degraded forest formalised"
        begins_at_event: 1
        ends_at_event: 2
        child_n_output: "Signed programme mandates; defined 150,000 ha boundary; community custodian register"

      - phase: 2
        name: "Data extraction — baseline remote sensing and field survey"
        begins_at_event: 2
        ends_at_event: 3
        child_n_output: "Carbon stock datasets by country and LC class; species inventories; livelihood baselines"

      - phase: 3
        name: "Specification — carbon quantification and credit potential"
        begins_at_event: 3
        ends_at_event: 4
        child_n_output: "7.05M gross / 5.64M net tCO2e/year; LC-stratified additionality cases by country"

      - phase: 4
        name: "Certification — verification, registration, and Article 6.2 authorisation"
        begins_at_event: 4
        ends_at_event: 5
        child_n_output: "Net tCO2e per country on standards registry; Article 6.2 authorisation letters; TVPCI structural quality baseline"
        # [NEW FIELD] tvpci_notes: TVPCI integration per phase
        tvpci_notes: "TVPCI baseline structural quality score is computed at this phase from the verified credit dataset. TrueValue Analytics and MSCI are custodians of the index computation."

      - phase: 5
        name: "Commercialisation outward — offtake, bond issuance, fisheries royalties"
        begins_at_event: 5
        ends_at_event: 6
        child_n_output: "Contracted offtake at USD 15–30/tCO2e; AUBEB bond proceeds; fisheries royalties; USD 84.6M+ annual reserve capacity"
        tvpci_notes: "TVPCI index tracks Phase 5 commercial terms against structural quality baseline established in Phase 4."

      - phase: 6
        name: "Commercialisation return — Conservation Fund capital deployment"
        begins_at_event: 6
        ends_at_event: 7
        child_n_output: "USD disbursed per country; ha under restoration contract; community employment agreements"

      - phase: 7
        name: "Specification — restoration design and CBEMR"
        begins_at_event: 7
        ends_at_event: 8
        child_n_output: "CBEMR site plans by country; seed provenance protocols; gender and youth employment plans"

      - phase: 8
        name: "Custodial — community co-management and stewardship"
        begins_at_event: 8
        ends_at_event: 9
        child_n_output: "Community governance structures registered; FPIC documentation; women and youth employment figures"

      - phase: 9
        name: "Physical recovery — active restoration and regeneration"
        begins_at_event: 9
        ends_at_event: 10
        child_n_output: "Ha under restoration by country and LC class; canopy recovery rate; early tCO2e sequestration (15–20 tCO2e/ha/yr Years 3–7)"

      - phase: 10
        name: "Verified restoration — sustained blue economy asset"
        begins_at_event: 10
        ends_at_event: null
        child_n_output: "5.64M net tCO2e/year verified; 150,000 ha protected; fisheries recovered; 1.5M+ livelihoods; TVPCI milestone score"
        tvpci_notes: "TVPCI convergence milestone is achieved at Phase 10. Score published and included in annual investor report."

    subprocesses:
      - event_number: null
        event_name: "Article 6.2 authorisation"
        belongs_to_phase: 4
        reason: "Does not itself change the form of the credit pool. Is a procedural step within the certification phase. Score would not reach boundary threshold as a standalone event."

      - event_number: null
        event_name: "FPIC and benefit-sharing agreement formalisation"
        belongs_to_phase: 8
        reason: "Occurs within the community co-management custodial phase. Is a governance sub-process, not a separate physical or structural transformation."

      - event_number: null
        event_name: "Seed provenance mapping"
        belongs_to_phase: 7
        reason: "Part of the restoration design specification phase. Does not produce an independent measurable output at programme level separable from the CBEMR plan."

      - event_number: null
        event_name: "African Seed Bank establishment"
        belongs_to_phase: 8
        reason: "Sub-process spanning Phases 7 and 8. Does not currently have a confirmed measurable output at programme level with defined governance and inventory. Should be elevated to Phase status if the Seed Bank achieves formal establishment. See analyst notes."

      - event_number: null
        event_name: "TVPCI index computation"
        belongs_to_phase: 4
        reason: "Computed at Phases 4 and 10. Does not constitute an independent supply chain event — it is a measurement of structural quality at specific phases, not a transformation of the material."

