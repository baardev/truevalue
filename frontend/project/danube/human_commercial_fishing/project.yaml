id: human_commercial_fishing
name: Commercial Fishing
basin: danube
type: human
service_category: provisioning
teeb_class: provisioning
description: >
  The human supply chain covering catch effort planning, active fishing operations, processing
  and cold chain, market access, and revenue capture for Danube basin freshwater commercial
  fisheries. The basin supports approximately 25,000 commercial fishing households, predominantly
  in Romania, Hungary, Serbia, Ukraine, and Moldova. Annual commercial catch is approximately
  22,000 tonnes of fish, valued at EUR 145 million at first sale. Aquaculture (predominantly
  carp and catfish) contributes a further 90,000 tonnes per year, mainly in Hungary, Romania,
  and Serbia, valued at EUR 210 million. The chain faces severe structural pressures: sturgeon
  commercial fishing has been nationally banned or severely restricted since 2006-2019 in all
  Danube states, removing the highest-value species from legal trade. Illegal poaching of
  sturgeon and other species remains significant in Romania, Serbia, Ukraine, and Moldova.
  The primary bottleneck is Phase 2 (Processing and Cold Chain) at 72% balance, where
  fragmented small-scale processing infrastructure and cold chain gaps result in high post-catch
  losses (estimated 18-25% in non-EU states) and limit market access for premium product grades.
  This subproject pairs with natural_fish_population to form the paired_fisheries composite.
paired_with:
  natural: natural_fish_population
  hub: paired_fisheries
data_availability: M
