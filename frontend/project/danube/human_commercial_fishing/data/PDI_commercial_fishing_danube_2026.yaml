pdi:
  material: "Danube commercial fishing operations"
  analyst: "Danube Basin Research Team"
  date_completed: "2026-04-27"
  service_type: human
  basin: danube
  paired_with: natural_fish_population
  hub: paired_fisheries

  sources_overview: |
    1. Eurostat Fishery Statistics FISH : inland catch by country and species; fishing employment; vessel numbers
    2. FAO FishStatJ : inland capture fisheries multi-year series; aquaculture production
    3. ICPDR Danube Sturgeon Task Force : ban enforcement, restocking, illegal trade data
    4. TRAFFIC : illegal sturgeon and caviar trade seizure reports
    5. FAO Aquaculture Production Statistics : carp and catfish production by country
    6. EEA WFD economic analysis : fisheries sector GDP, recreational licensing
    7. EMFAF (European Maritime, Fisheries and Aquaculture Fund) disbursement reports
    8. World Bank : fisheries governance and post-harvest loss studies (Eastern Europe)

  geographic_scope:
    basin: danube
    mainstream_countries: 10
    catchment_countries: 19
    commercial_fishing_households: 25000
    annual_commercial_catch_tonnes: 22000
    aquaculture_production_tonnes: 90000

  infrastructure_parameters:
    commercial_catch_value_eur_mn: 145
    aquaculture_value_eur_mn: 210
    total_sector_value_eur_mn: 355
    recreational_fishing_licences: 480000
    recreational_fishing_value_eur_mn: 85
    total_fisheries_economy_eur_mn: 440
    processing_facilities_with_cold_chain_pct: 58
    post_catch_loss_non_eu_pct: 21
    illegal_poaching_pct_of_legal: 21
    certified_fishing_operations_pct: 35

  supply_chain_phases:
    phase_0:
      id: 0
      name: "Licencing, Quota Setting, and Effort Planning"
      phase_category: Upstream
      physical_state_in: "Fish population stock assessments; regulatory framework"
      physical_state_out: "Issued licences, annual catch quotas by species, fishing zone allocations, seasonal closure schedules"
      primary_transformation: "Stock assessment, quota calculation, licence administration, zone mapping"
      typical_time_scale: "Annual regulatory cycle; management plan review every 3-6 years"
      transparency_level: Medium
      measurable_output: "Number of commercial licences issued; quota utilisation rate (%); basin-wide quota coordination index"
      output_unit: "licences; percent utilisation; coordination index 0-1"
      data_status: PARTIAL
      primary_sources:
        - "National fisheries authorities (Romania ANPA, Hungary MOHOSZ, Serbia)"
        - "ICPDR Danube Fisheries Working Group"
        - "Eurostat FISH : fishing fleet and effort data"
      opacity_score: 2
      key_values:
        commercial_licences_basin: 18500
        quota_utilisation_rate_pct: 78
        basin_wide_coordination_index: 0.42
        countries_with_stock_based_quotas: 5
        countries_with_effort_based_limits: 5
        recreational_licences_basin: 480000
      notes: >
        Quota setting across 10 countries is not coordinated at basin level: there is no Danube-wide
        fisheries management plan equivalent to the Common Fisheries Policy for marine waters.
        Five countries set quotas based on stock assessments (Romania, Hungary, Croatia, Bulgaria, Austria);
        the other five use effort-based controls (Serbia, Ukraine, Moldova, Slovakia, Germany).
        The coordination index of 0.42 (on a 0-1 scale) reflects this fragmentation. Without a
        basin-wide quota framework, the total harvest can exceed sustainable yield even if each
        country's individual allocation appears conservative. The bond intervention for this phase is
        financing a basin-wide fisheries stock assessment and a multilateral quota coordination protocol.

    phase_1:
      id: 1
      name: "Fishing Operations and Active Harvest"
      phase_category: Upstream
      physical_state_in: "Licensed fishing grounds with available stock"
      physical_state_out: "Caught fish in ice or live-well on vessel; landed at quayside"
      primary_transformation: "Net deployment, line fishing, trap operation, haul and sorting, live transport for aquaculture supply"
      typical_time_scale: "Daily-weekly fishing trips; seasonal variation"
      transparency_level: Medium
      measurable_output: "Annual catch volume (tonnes); catch per unit effort (CPUE kg/trip); compliance rate (%)"
      output_unit: "tonnes/yr; kg/trip CPUE"
      data_status: PARTIAL
      primary_sources:
        - "Eurostat FISH : landings data by country and species"
        - "FAO FishStatJ : inland catch time series"
        - "TRAFFIC : illegal catch seizure data"
      opacity_score: 2
      key_values:
        annual_legal_catch_tonnes: 22000
        cpue_main_channel_kg_trip: 18
        cpue_floodplain_kg_trip: 31
        illegal_catch_estimated_tonnes: 4600
        gear_compliance_with_mesh_size_pct: 71
        sturgeon_poaching_incidents_per_yr: 340
      notes: >
        Annual legal commercial catch of 22,000 tonnes has declined approximately 35% over 20 years.
        CPUE is markedly higher in floodplain habitats (31 kg/trip) than the main channel (18 kg/trip),
        confirming floodplain habitat value. Illegal catch is estimated at 4,600 tonnes/yr (21% of
        legal volume), with significant concentrations in the lower Danube (Romania, Serbia, Ukraine,
        Moldova). Sturgeon poaching generates approximately 340 detected incidents per year; actual
        poaching frequency is estimated 3-5x higher. Gear compliance (mesh size regulations protecting
        juvenile fish) is 71% in EU member states; lower in non-EU.

    phase_2:
      id: 2
      name: "Processing, Cold Chain, and Preservation"
      phase_category: Midstream
      physical_state_in: "Fresh catch landed at quay or processing facility"
      physical_state_out: "Processed fish products: whole fresh/chilled, fillets, smoked, frozen, live aquaculture fish"
      primary_transformation: "Gutting, filleting, smoking, freezing, vacuum-packing, or live transport to markets"
      typical_time_scale: "Hours to days post-catch for fresh; weeks for smoked/frozen"
      transparency_level: Medium
      measurable_output: "Processing recovery rate (%); cold chain coverage (%); post-catch loss rate (%)"
      output_unit: "percent recovery; percent cold chain; percent loss"
      data_status: PARTIAL
      primary_sources:
        - "World Bank Post-Harvest Loss Assessment Eastern Europe"
        - "FAO Technical Paper : improving inland fisheries value chains"
        - "Eurostat food and drink processing statistics"
      opacity_score: 2
      key_values:
        cold_chain_coverage_pct: 58
        post_catch_loss_eu_states_pct: 8
        post_catch_loss_non_eu_states_pct: 21
        processing_recovery_rate_pct: 62
        smoked_fish_share_of_value_pct: 18
        live_fish_for_aquaculture_share_pct: 24
      notes: >
        Phase 2 is the primary bottleneck of the human chain at 72% balance. Cold chain coverage
        of only 58% means that nearly half of catch in the lower Danube and non-EU states is
        transported without refrigeration, generating 21% post-catch loss. Post-catch losses in
        EU member states are much lower (8%) due to better infrastructure. The processing recovery
        rate of 62% (edible product weight / live catch weight) is below the European inland
        fisheries benchmark of 72%, reflecting the dominance of small-scale artisanal operators
        without specialised filleting equipment. The value lost to post-catch deterioration and
        processing inefficiency is estimated at EUR 35-45M/yr. A performance bond targeting cold
        chain infrastructure in Romania, Serbia, and Ukraine would address the single largest
        value-chain efficiency gap.

    phase_3:
      id: 3
      name: "Market Access and Distribution"
      phase_category: Midstream
      physical_state_in: "Processed fish products ready for distribution"
      physical_state_out: "Fish products at retail, food service, or export markets; aquaculture fish at pond-gate or live transport"
      primary_transformation: "Wholesale aggregation, labelling, food safety certification, transport, export documentation"
      typical_time_scale: "Days to weeks for domestic; 2-4 weeks for export"
      transparency_level: Medium
      measurable_output: "Domestic retail market share (%); export volume (tonnes); food safety certification rate (%)"
      output_unit: "percent domestic; tonnes export; percent certified"
      data_status: PARTIAL
      primary_sources:
        - "Eurostat Foreign Trade : fish and fishery products"
        - "FAO Food Safety : codex alimentarius compliance"
        - "EMFAF market development grants database"
      opacity_score: 2
      key_values:
        domestic_consumption_share_pct: 68
        export_volume_tonnes: 7000
        food_safety_certified_share_pct: 52
        retail_price_common_carp_eur_kg: 3.80
        retail_price_pike_perch_eur_kg: 9.20
        aquaculture_export_value_eur_mn: 45
      notes: >
        68% of catch is consumed domestically at low average prices (EUR 3.80/kg for common carp).
        Pike-perch commands a significant premium (EUR 9.20/kg) as the main export species to
        German and Austrian markets. Food safety certification covers only 52% of commercial catch
        volume: non-certified product is sold in local markets at heavily discounted prices, reducing
        sector revenue. Aquaculture (predominantly carp from Hungary and Romania) exports generate
        EUR 45M/yr. Market development support from EMFAF has been limited in non-EU states.
        The bond KPI for this phase would be food safety certification rate: current 52%; target
        70% yr5, 85% yr10.

    phase_4:
      id: 4
      name: "Revenue Capture and Sector Reinvestment"
      phase_category: Downstream
      physical_state_in: "Fish product sales revenue"
      physical_state_out: "Revenue distributed to fishing households; reinvested in vessels, gear, licences, and habitat conservation contributions"
      primary_transformation: "Revenue accounting, tax and royalty payment, licence fee recycling, EMFAF grant matching, conservation levy"
      typical_time_scale: "Annual revenue cycle"
      transparency_level: Medium
      measurable_output: "Average household income from fishing (EUR/yr); reinvestment ratio (%); conservation levy collected (EUR/yr)"
      output_unit: "EUR/yr household; reinvestment %"
      data_status: PARTIAL
      primary_sources:
        - "EEA WFD economic analysis of water uses"
        - "FAO : inland fisheries livelihoods"
        - "EMFAF disbursement data (EU member states)"
      opacity_score: 2
      key_values:
        average_household_fishing_income_eur_yr: 5800
        emfaf_fisheries_allocation_eur_mn_2021_2027: 320
        conservation_levy_from_licence_fees_eur_mn_yr: 12
        reinvestment_in_habitat_management_pct: 8
        recreational_licence_revenue_eur_mn_yr: 28
        total_sector_public_support_eur_mn_yr: 65
      notes: >
        Average household fishing income of EUR 5,800/yr is low relative to EU average rural incomes
        (EUR 18,000-24,000/yr), explaining why commercial fishing is increasingly a secondary
        livelihood rather than a primary occupation. EMFAF provides EUR 320M over 2021-2027 for
        Danube basin member states, but disbursement is skewed toward vessel modernisation rather
        than stock monitoring or habitat restoration. Conservation levy reinvestment (8% of licence
        revenue to habitat management) is below the 20% benchmark seen in well-managed European
        fisheries. The bond design for this phase should link a conservation levy top-up to verified
        improvements in fish pass construction and enforcement capacity.

  ndc_derivation:
    phase_0: {D: 264, C: 244, balance: 78.0, N: 200, sustainability: 0.94}
    phase_1: {D: 264, C: 248, balance: 80.0, N: 207, sustainability: 0.95}
    phase_2: {D: 260, C: 232, balance: 72.0, N: 183, sustainability: 0.92}
    phase_3: {D: 264, C: 244, balance: 77.0, N: 197, sustainability: 0.94}
    phase_4: {D: 260, C: 236, balance: 74.0, N: 190, sustainability: 0.93}

  coherence_scores:
    pi: 76.0   # chain avg: (78+80+72+77+74)/5 = 76.2; rounded
    phi: 44.0  # proportional: 68% domestic at low prices; high-value export share thin; aquaculture dominant
    sqrt2: 60.0  # structural: 25000 households; fragmented small-scale; significant non-EU governance gap
    ln2: 58.0    # growth: aquaculture growing; wild catch declining; EMFAF investment positive but insufficient
    e: 24.0      # abstract: EMFAF grants input-based; no performance bond for fisheries; TRAFFIC seizure data not monetised

  analyst_notes: |
    The commercial fishing chain averages 76.2% balance, with Phase 2 (Processing and Cold Chain,
    72%) as the primary bottleneck. The 21% post-catch loss in non-EU states represents a direct
    value destruction of EUR 35-45M/yr from a sector generating EUR 355M/yr total. Cold chain
    infrastructure investment in Romania, Serbia, and Ukraine is the single highest-return
    physical intervention available.

    Phase 4 (Revenue Capture, 74%) is the second weak point: average household income of EUR 5,800/yr
    competes poorly with alternative livelihoods, reducing the sector's ability to attract
    investment and enforce sustainable practices. The conservation levy reinvestment rate of 8%
    is well below benchmarks.

    The e-score of 24 reflects early-stage financial abstraction: EMFAF grants are input-based,
    there are no verified outcome instruments, and conservation levies are minimal. A fisheries
    performance bond that links coupon to verified improvements in processing compliance, illegal
    catch reduction, and fish pass construction (in the natural counterpart) would shift e toward
    45-55.

    Bond design for the paired fisheries instrument should be structured in two tranches:
    - Tranche 1: Processing infrastructure (cold chain in non-EU states, food safety certification)
    - Tranche 2: Natural system restoration (fish pass construction at priority dams, floodplain reconnection for nursery habitat)
    KPIs span both subprojects: post-catch loss rate (human), fish pass operational rate (natural),
    illegal catch rate (joint), and recruitment index for key species (natural).
