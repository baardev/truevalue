id: natural_river_channel
name: River Channel
basin: danube
type: natural
service_category: provisioning
teeb_class: regulating
description: >
  The Danube River channel is the physical backbone of the entire basin hydrological system,
  providing the primary conduit for freshwater, sediment, nutrients, and biota from the Alps
  and Carpathians to the Black Sea. The river stretches 2,860 km from source to delta, draining
  801,463 km2 across 19 countries. The natural channel service cascade models the system from
  precipitation and snowmelt (Phase 0) through tributary confluence and flow accumulation (Phase 1),
  channel morphology and substrate function (Phase 2), sediment transport and geomorphic work
  (Phase 3), and multi-purpose flow delivery to the delta and Black Sea (Phase 4).
  The primary ecological bottleneck is Phase 3 (Sediment Transport, 72% balance): Iron Gate I and II
  trap approximately 57% of sediment that historically reached the delta, permanently altering the
  geomorphological regime of the lower Danube and accelerating delta subsidence. The channel also
  carries the legacy of 20th-century channelisation: approximately 80% of the historical side-arm
  and floodplain network has been cut off, reducing channel sinuosity, increasing flood velocities,
  and eliminating lateral connectivity that supports fisheries, reed beds, and floodplain forests.
  This subproject pairs with human_commercial_navigation to form the paired_navigation composite.
paired_with:
  human: human_commercial_navigation
  hub: paired_navigation
data_availability: H
