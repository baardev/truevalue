id: human_cultural_heritage_management
name: Cultural Heritage Management
basin: danube
type: human
service_category: cultural
teeb_class: cultural
description: >
  The Danube corridor contains one of Europe's densest concentrations of cultural heritage:
  15+ UNESCO World Heritage Sites, the Roman Danube Limes (2021 transboundary inscription),
  the Wachau Cultural Landscape, historic city centres at Vienna, Budapest, and Bratislava,
  the Iron Gate gorge archaeological zone, and the Danube Delta traditional communities
  (Ramsar 1991). This subproject models the human management chain from heritage inventory
  and documentation through site preservation, visitor access infrastructure, cultural
  programming, and sustainable tourism revenue generation. Total cultural tourism expenditure
  in the basin is estimated at EUR 2.8-3.5 billion per year (2019 baseline). The subproject
  pairs with natural_delta_biodiversity to form the paired_ecotourism composite, reflecting
  the co-dependence of ecotourism revenue on both the ecological asset and the human
  management infrastructure.
paired_with:
  natural: natural_delta_biodiversity
  hub: paired_ecotourism
data_availability: M
