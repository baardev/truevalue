id: human_irrigation_infrastructure
name: Irrigation Infrastructure
basin: danube
type: human
service_category: provisioning
teeb_class: provisioning
description: >
  The engineered irrigation supply chain abstracting 22 km³/yr from the Danube
  system to irrigate ~2.8 million hectares of agricultural land across the basin.
  The largest single water-use sector — 63% of total basin abstraction. Primary
  countries: Hungary, Romania, Bulgaria, Serbia, Ukraine. Much of the canal
  infrastructure is Soviet-era (1950s-1970s), poorly monitored, and operating
  at 45-55% efficiency. The natural asset paired with this chain is the
  agricultural allocation from natural_freshwater_availability.
paired_with:
  natural: natural_freshwater_availability
  hub: paired_agricultural_water
data_availability: M
primary_sources:
  - name: "FAO AQUASTAT"
    url: "https://www.fao.org/aquastat"
    metrics: "irrigation water withdrawal by country and sector"
  - name: "Eurostat Agricultural Statistics"
    url: "https://ec.europa.eu/eurostat/web/agriculture"
    metrics: "irrigated area by method, EU member states"
  - name: "EU CAP (Common Agricultural Policy) reporting"
    url: "https://agriculture.ec.europa.eu"
    metrics: "irrigation investment, agri-environment scheme participation"
  - name: "FAO AQUASTAT Irrigation and Drainage Paper 66"
    url: "https://www.fao.org/3/a-bc596e.pdf"
    metrics: "irrigation efficiency by system type and country"
  - name: "ICPDR Danube Basin Analysis"
    url: "https://www.icpdr.org"
    metrics: "agricultural pressures and abstraction from WFD reporting"
  - name: "World Bank IBRD water and agriculture sector assessments"
    url: "https://www.worldbank.org"
    metrics: "irrigation rehabilitation investment needs"
key_metrics:
  agricultural_abstraction_km3_yr: 22
  irrigated_area_ha: 2800000
  irrigation_efficiency_pct_avg: 50
  irrigation_efficiency_potential_pct: 75
  water_saving_potential_km3_yr: 5.5
  eu_cap_irrigation_support_bn_eur: 2.1
  primary_irrigation_countries:
    - Romania
    - Hungary
    - Bulgaria
    - Serbia
    - Ukraine
    - Italy (Po-Danube watershed margin)
infrastructure_age_note: >
  60-70% of canal infrastructure was built between 1950 and 1975. Significant
  rehabilitation investment needed across the lower basin. EU Cohesion Fund and
  CAP provide partial financing for EU member states.
