id: human_commercial_navigation
name: Commercial Navigation
basin: danube
type: human
service_category: provisioning
teeb_class: provisioning
description: >
  The Danube is Europe's second longest river and the busiest international waterway after the Rhine,
  carrying approximately 34 million tonnes of cargo per year on the 2,414 km navigable section
  from Kelheim (Germany) to the Black Sea, including the Rhine-Main-Danube Canal link to Western
  Europe. The navigable channel is managed under the 1948 Belgrade Convention by the Danube Commission
  (13 member states) and is classified as a core Trans-European Transport Network (TEN-T) corridor.
  Annual transport value is estimated at EUR 5-8 billion/yr in trade facilitation. The principal
  operator nations are Austria, Slovakia, Hungary, Croatia, Serbia, Bulgaria, Romania, Ukraine,
  and Moldova. The primary bottleneck is Phase 2 (Fairway Maintenance and Dredging, 72% balance):
  critical shallows at the Iron Gate gorge exit (Romanian-Serbian border) and the Bratislava-Budapest
  reach regularly constrain vessel drafts to 1.5-2.0 m in low-flow years, well below the 2.5 m
  design depth of the TEN-T standard. Climate change is lengthening low-flow periods, making dredging
  an increasingly expensive and ecologically damaging maintenance activity.
  This subproject pairs with natural_river_channel to form the paired_navigation composite.
paired_with:
  natural: natural_river_channel
  hub: paired_navigation
data_availability: H
