id: human_reed_industry
name: Reed Industry
basin: danube
type: human
service_category: provisioning
teeb_class: provisioning
description: >
  The Danube Delta reed industry is the largest commercial reed harvesting operation in Europe
  and one of the largest in the world. Annual commercial harvest is approximately 120,000-150,000
  tonnes of dry reed from the Danube Delta Biosphere Reserve, plus an additional 30,000-40,000
  tonnes from the lower Danube floodplain. The primary product is thatching reed (Phragmites
  australis) sold to European and North American markets for roof thatching at EUR 1.20-1.80 per
  bundle. Secondary products include reed board for construction insulation, biogas substrate,
  paper pulp, and horticultural mulch. The principal operator is the state-owned SC Deltaprod SRL
  (Romania), with a growing private sector. The industry employs approximately 4,500 seasonal
  workers, predominantly from Tulcea and Constanta counties. The primary bottleneck is Phase 3
  (Market Access and Certification, 72% balance): only 35% of harvested reed reaches premium
  thatching markets; the remainder is sold as low-value bulk product. A verified sustainability
  certification (equivalent to FSC for reed) does not yet exist, limiting access to high-value
  European and UK thatching markets. This subproject pairs with natural_reed_bed to form the
  paired_reed_harvesting composite.
paired_with:
  natural: natural_reed_bed
  hub: paired_reed_harvesting
