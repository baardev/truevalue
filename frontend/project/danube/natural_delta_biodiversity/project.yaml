id: natural_delta_biodiversity
name: Danube Delta Biodiversity Habitat
basin: danube
type: natural
service_category: habitat
teeb_class: habitat
description: >
  The Danube Delta is the second largest river delta in Europe (5,800 km²),
  covering Romania (75%) and Ukraine (25%). It is a UNESCO World Heritage Site
  and Ramsar wetland (both 1991), harbouring over 300 bird species, 45 freshwater
  fish species, and the largest continuous reed bed in Europe (~178,000 ha).
  This subproject models the ecological production function cascade from upstream
  sediment and nutrient supply through habitat formation to biodiversity service
  delivery. The dominant threat is the Iron Gate I/II dam system, which reduced
  upstream sediment load by approximately 57%, interrupting the delta-building
  process and degrading habitat heterogeneity.
