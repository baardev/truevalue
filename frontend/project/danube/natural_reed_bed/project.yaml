id: natural_reed_bed
name: Reed Bed Biomass
basin: danube
type: natural
service_category: provisioning
teeb_class: provisioning
description: >
  The Danube Delta and associated wetlands contain the largest continuous reed bed in the world,
  covering approximately 1,750 km2 of Phragmites australis (common reed) within the Danube Delta
  Biosphere Reserve alone, with a further 850 km2 of reed-dominated wetland in the floodplain of
  the lower Danube and Danube-Black Sea canal zone. Total reed bed area across the basin is
  estimated at 2,800 km2. The delta reed beds produce approximately 800,000 tonnes of dry reed
  biomass per year, representing one of the largest renewable biomass resources in Europe. The
  natural service cascade runs from hydrological connectivity and nutrient loading (Phase 0)
  through reed establishment and colonisation (Phase 1), biomass accumulation (Phase 2), standing
  stock maturation (Phase 3), and harvestable biomass delivery (Phase 4). The primary ecological
  bottleneck is Phase 0: altered hydrology from the Chilia arm regulation and sediment reduction
  (57% less sediment reaching the delta from Iron Gate dams) is causing lateral reed bed expansion
  onto previously open water while simultaneously degrading the productivity of older reed stands.
  This subproject pairs with human_reed_industry to form the paired_reed_harvesting composite.
paired_with:
  human: human_reed_industry
  hub: paired_reed_harvesting
data_availability: M
