id: human_floodplain_forestry_operations
name: Floodplain Forestry Operations
basin: danube
type: human
service_category: provisioning
teeb_class: provisioning
description: >
  The human management chain covering inventory, sustainable harvesting, timber processing,
  market access, and revenue reinvestment for Danube floodplain forests. Annual timber harvest
  from Danube riparian forests is approximately 800,000 m3 per year, with a further 60,000 ha
  of managed poplar and willow short-rotation plantations yielding 10-12 m3/ha/yr. EU member
  states (Austria, Hungary, Croatia, Romania, Bulgaria) operate under FSC or PEFC certification
  for approximately 45% of the commercial area. Non-EU states (Serbia, Ukraine, Moldova, Bosnia)
  have significant illegal logging pressure estimated at 20-30% of harvest volume. Carbon credit
  potential from verified additionality is approximately 0.8-1.2 Mt CO2/yr at current
  measurement standards, with EUR 60-80M/yr revenue potential at EU ETS prices. The subproject
  pairs with natural_floodplain_forest_biomass to form the paired_floodplain_forestry composite.
  The primary bottleneck is Phase 3 (Market Access and Certification) at 73% balance, where
  only 45% of harvest is certified and carbon markets are underdeveloped for floodplain forests.
paired_with:
  natural: natural_floodplain_forest_biomass
  hub: paired_floodplain_forestry
data_availability: M
primary_sources:
  - name: "FAO Global Forest Resources Assessment (FRA)"
    url: "https://www.fao.org/forest-resources-assessment"
    metrics: "Growing stock, annual harvest volumes, forest ownership, management plans by country"
  - name: "FAOSTAT Forestry Production and Trade"
    url: "https://www.fao.org/faostat"
    metrics: "Roundwood production, sawnwood output, wood fuel volumes, trade values"
  - name: "FSC / PEFC certification databases"
    url: "https://info.fsc.org / https://www.pefc.org"
    metrics: "Certified forest area by country, chain of custody certificates, annual audits"
  - name: "EFI European Forest Sector Outlook"
    url: "https://www.efi.int"
    metrics: "Timber prices, biomass energy demand, forest industry employment"
  - name: "Verra / Gold Standard (voluntary carbon markets)"
    url: "https://verra.org"
    metrics: "Verified carbon credits from riparian forest restoration projects"
  - name: "EU LULUCF Regulation reporting"
    url: "https://ec.europa.eu/environment/forests"
    metrics: "Forest sink/source accounting, net sequestration by member state"
key_metrics:
