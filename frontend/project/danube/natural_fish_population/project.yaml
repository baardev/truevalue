id: natural_fish_population
name: Fish Population
basin: danube
type: natural
service_category: provisioning
teeb_class: provisioning
description: >
  The Danube and its tributaries support approximately 100 native fish species, the highest
  freshwater fish diversity of any European river system. The natural fish population service
  cascade runs from habitat provision (spawning grounds, floodplain nurseries, migration corridors)
  through juvenile recruitment, adult biomass accumulation, and harvest-ready population stock.
  Total commercial and recreational fishable biomass is estimated at 420,000 tonnes across the
  basin. The cascade faces four converging pressures: 60 dams blocking migration routes (most
  critically the Iron Gate I and II), 47% loss of floodplain nursery habitat, heavy eutrophication
  in the middle and lower basin (40% of water bodies failing WFD good ecological status),
  and overfishing pressure in the lower basin and delta. The primary bottleneck is Phase 1
  (Habitat and Migration), where dam fragmentation has severed 84% of the historical migratory
  fish range. This subproject pairs with human_commercial_fishing to form the paired_fisheries
  composite.
paired_with:
  human: human_commercial_fishing
  hub: paired_fisheries
data_availability: M
