id: danube
name: Danube Basin
type: basin_hub
region: Central and Eastern Europe
basin_area_km2: 801463
mainstream_countries: 10
catchment_countries: 9
total_countries: 19
population_in_basin: 81000000
river_length_km: 2860
description: >
  The Danube Basin is the second longest river basin in Europe, spanning
  19 countries from Germany to the Black Sea. This hub organises ecosystem
  service subprojects by type: natural (ecological production functions),
  human (infrastructure and activity chains), and paired (natural asset
  with human extraction or delivery chain).
subprojects:
  natural:
    - natural_freshwater_availability
    - natural_fish_population
    - natural_wild_food_fodder
    - natural_reed_bed
    - natural_river_groundwater_flow
    - natural_floodplain_forest_biomass
    - natural_flood_regulation
    - natural_water_purification
    - natural_carbon_sequestration
    - natural_erosion_sediment_regulation
    - natural_groundwater_recharge
    - natural_climate_regulation
    - natural_delta_biodiversity
    - natural_migratory_bird_habitat
    - natural_sturgeon_spawning_habitat
    - natural_floodplain_forest_habitat
    - natural_nutrient_cycling
    - natural_primary_production
    - natural_river_channel
  human:
    - human_freshwater_supply_infrastructure
    - human_commercial_navigation
    - human_flood_embankments
    - human_irrigation_infrastructure
    - human_cultural_heritage_management
  paired:
    - paired_fisheries
    - paired_reed_harvesting
    - paired_floodplain_forestry
    - paired_freshwater_supply
    - paired_agricultural_water
    - paired_ecotourism
    - paired_navigation
pilot_subprojects:
  - natural_freshwater_availability
  - human_freshwater_supply_infrastructure
governance:
  primary_authority: ICPDR (International Commission for the Protection of the Danube River)
  eu_framework: EU Water Framework Directive (2000/60/EC)
  monitoring_body: ICPDR Joint Danube Survey (every 6 years)
primary_sources:
  - ICPDR (icpdr.org)
  - AQUASTAT (FAO)
  - ERA5 reanalysis (Copernicus)
  - WHO/UNICEF JMP
  - GRDC (Global Runoff Data Centre)
  - GRACE-FO (NASA)
created: "2026-04-27"
