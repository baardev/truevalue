pdi:
  material: "Danube Basin freshwater supply infrastructure"
  analyst: "AI (Sonnet 4.6)"
  date_completed: "2026-04-27"
  service_type: human
  basin: danube
  paired_with: natural_freshwater_availability

  sources_overview: |
    1. WHO/UNICEF Joint Monitoring Programme (JMP) — drinking water access,
       service level, coverage by country. Annual. https://washdata.org
    2. AQUASTAT (FAO) — water withdrawal by sector (municipal, agricultural,
       industrial). Annual, country-level. https://www.fao.org/aquastat
    3. Eurostat Water Statistics — EU member state abstraction, distribution
       losses, treatment capacity. https://ec.europa.eu/eurostat
    4. EU Water Framework Directive (WFD) reporting — water body status,
       pressures, abstractions per river basin district.
       https://water.europa.eu
    5. IBNET (World Bank) — water utility benchmarking (non-revenue water,
       operational efficiency). https://ibnet.org
    6. WHO Guidelines for Drinking-water Quality (4th edition, 2017) —
       treatment standards and compliance reference.

  geographic_scope:
    basin: Danube
    population_served: 81000000
    mainstream_countries: 10
    total_countries: 19
    eu_members_in_basin:
      - Germany
      - Austria
      - Slovakia
      - Hungary
      - Croatia
      - Romania
      - Bulgaria
      - Slovenia
      - Czech Republic
    non_eu_members_in_basin:
      - Serbia
      - Bosnia and Herzegovina
      - Montenegro
      - Moldova
      - Ukraine
      - North Macedonia
      - Albania

  infrastructure_parameters:
    population_with_safely_managed_water_pct: 88
    urban_access_pct: 97
    rural_access_pct: 76
    annual_total_abstraction_km3: 35
    municipal_abstraction_km3: 8.5
    agricultural_abstraction_km3: 22
    industrial_abstraction_km3: 4.5
    non_revenue_water_pct_approx: 25
    treatment_standards:
      eu_members: "EU Drinking Water Directive (98/83/EC revised 2020/2184)"
      non_eu_members: "WHO Guidelines for Drinking-water Quality (4th ed.)"

  supply_chain_phases:
    phase_0:
      id: 0
      name: "River and Groundwater Intake"
      phase_category: "Upstream"
      physical_state_in: "Natural surface water or groundwater at source"
      physical_state_out: "Raw water at intake point"
      primary_transformation: "Abstraction and initial screening"
      typical_time_scale: "Continuous"
      transparency_level: "High"
      measurable_output: "Raw water abstraction volume (m3/yr)"
      output_unit: "m3/yr"
      data_status: "POPULATED"
      primary_sources: ["AQUASTAT", "Eurostat", "national water authority permits"]
      opacity_score: 1
      key_values:
        municipal_abstraction_km3_yr: 8.5
        surface_water_fraction_pct: 65
        groundwater_fraction_pct: 35
        eu_abstraction_permit_required: true
      notes: >
        Intake points on Danube main channel, tributaries, and floodplain wells.
        EU member states require abstraction permits under WFD Article 11.
        AQUASTAT reports annual abstraction by country and sector.
        Non-EU members have variable permit frameworks.

    phase_1:
      id: 1
      name: "Raw Water Conveyance to Treatment"
      phase_category: "Upstream"
      physical_state_in: "Raw water at intake"
      physical_state_out: "Raw water delivered to treatment works"
      primary_transformation: "Pumping and pipeline transport"
      typical_time_scale: "Hours"
      transparency_level: "High"
      measurable_output: "Conveyance volume (m3/yr); losses (%)"
      output_unit: "m3/yr"
      data_status: "POPULATED"
      primary_sources: ["Utility operational data", "Eurostat", "IBNET"]
      opacity_score: 1
      key_values:
        conveyance_loss_pct_approx: 3
        max_distance_km: 80
        energy_intensity_kwh_m3: 0.12
      notes: >
        Large basin utilities (Vienna, Budapest, Bucharest) operate extensive
        raw water aqueducts. Conveyance losses typically 2-5%. Energy is the
        primary operating cost. Data available via national utility reports
        and Eurostat energy in water sector statistics.

    phase_2:
      id: 2
      name: "Water Treatment"
      phase_category: "Midstream"
      physical_state_in: "Raw water (surface or groundwater)"
      physical_state_out: "Treated water meeting WHO/EU standards"
      primary_transformation: "Coagulation, sedimentation, filtration, disinfection"
      typical_time_scale: "Hours"
      transparency_level: "High"
      measurable_output: "Treated water volume meeting drinking water standards (m3/yr)"
      output_unit: "m3/yr"
      data_status: "POPULATED"
      primary_sources: ["WHO/UNICEF JMP", "EU Drinking Water Directive compliance reports", "national regulators"]
      opacity_score: 1
      key_values:
        eu_directive_compliance_pct: 99.5
        treatment_types: ["coagulation", "filtration", "chlorination", "UV disinfection", "ozonation"]
        pharmaceutical_removal: "emerging challenge; not yet universally regulated"
        energy_intensity_kwh_m3: 0.35
      notes: >
        EU member states report treatment compliance under Drinking Water Directive.
        Non-EU countries report to WHO via JMP. Treatment is the most energy-intensive
        phase. Emerging contaminants (pharmaceuticals, microplastics) represent the
        next regulatory frontier, currently opaque in terms of removal rates.

    phase_3:
      id: 3
      name: "Pressurized Distribution Network"
      phase_category: "Midstream"
      physical_state_in: "Treated water at treatment works outlet"
      physical_state_out: "Treated water in consumer distribution mains"
      primary_transformation: "Pressure management, pumping, storage in service reservoirs"
      typical_time_scale: "Continuous"
      transparency_level: "Medium"
      measurable_output: "Non-revenue water percentage; distribution losses"
      output_unit: "%"
      data_status: "PARTIAL"
      primary_sources: ["IBNET (World Bank water utility benchmarks)", "Eurostat", "national regulators"]
      opacity_score: 2
      key_values:
        non_revenue_water_pct: 25
        high_income_countries_nrw_pct: 12
        low_income_countries_nrw_pct: 40
        pipe_age_years_avg: 35
        leakage_km3_yr: 2.1
        pipe_material_issue: "asbestos cement still present in older networks"
      notes: >
        Distribution losses (non-revenue water) average ~25% across basin but range
        from ~10% in Austria/Germany to ~40% in parts of Romania/Moldova/Ukraine.
        Network condition and pipe age are the key D parameters. IBNET provides
        benchmarks. Detailed network topology is utility-specific and often
        commercially sensitive — the key opacity in this phase.

    phase_4:
      id: 4
      name: "Consumer Delivery and Metering"
      phase_category: "Downstream"
      physical_state_in: "Treated water in distribution main"
      physical_state_out: "Water at consumer premises (metered)"
      primary_transformation: "Final service connection; metering; billing"
      typical_time_scale: "Continuous"
      transparency_level: "High"
      measurable_output: "Water delivered per capita (litres/person/day); access coverage (%)"
      output_unit: "litres/person/day"
      data_status: "POPULATED"
      primary_sources: ["WHO/UNICEF JMP", "Eurostat", "IBNET", "national utility reports"]
      opacity_score: 1
      key_values:
        per_capita_consumption_l_person_day: 160
        eu_average_l_person_day: 130
        total_billed_consumption_km3_yr: 4.3
        access_coverage_pct: 88
        unserved_population: 9720000
        unserved_mostly: "rural areas, Romania, Ukraine, Moldova, Bosnia"
      notes: >
        ~88% of basin population has safely managed drinking water (JMP 2023).
        Unserved ~9.7 million concentrated in rural areas of lower basin countries.
        Consumption data available via JMP and Eurostat. Metering coverage above
        95% in EU members; lower in non-EU countries.

  ndc_derivation:
    # D/C/N values derived using PDI-to-HTML pipeline formula.
    # D = 200 + (D_flags × 20) + (boundary_score × 4)
    # C = 200 + (C_flags × 20) + (opacity × 8)
    # balance = high->90±4, medium->83±4, low->70±4
    # N = round((D + C) / 2 × (balance / 100))
    phase_0: {D: 276, C: 248, balance: 91.0, N: 238, sustainability: 0.95}
    phase_1: {D: 252, C: 228, balance: 88.0, N: 211, sustainability: 0.95}
    phase_2: {D: 300, C: 248, balance: 93.0, N: 255, sustainability: 0.91}
    phase_3: {D: 268, C: 236, balance: 81.0, N: 204, sustainability: 0.94}
    phase_4: {D: 256, C: 248, balance: 90.0, N: 227, sustainability: 0.98}

  coherence_scores:
    pi: 88.6
    phi: 61.0
    sqrt2: 68.0
    ln2: 74.0
    e: 42.0

  analyst_notes: |
    The human freshwater supply infrastructure is the most data-rich human system
    in the Danube Basin. JMP, AQUASTAT, and Eurostat together provide near-complete
    coverage of phases 0, 1, 2, and 4.

    The primary structural weakness is Phase 3 (distribution network): non-revenue
    water losses of 25% average indicate significant infrastructure deficit in the
    lower basin. This is both a financial liability (lost treated water) and an
    ecological coupling risk (it increases pressure on the natural asset in Phase 4
    of the paired natural_freshwater_availability service).

    The e (Abstract) score of 42 reflects the existence of EU regulatory frameworks,
    water pricing mechanisms, and development bank financing for water infrastructure —
    there is a partial financial abstraction layer. Bonding against this infrastructure
    asset is structurally feasible, as utility revenue streams and regulatory
    frameworks provide the cash flow basis.

    Key bonding risk: Phase 3 distribution losses directly reduce the revenue-generating
    capacity of the infrastructure relative to its abstraction and treatment costs.
    A bond could be structured around investment in network rehabilitation with
    performance triggers linked to reducing non-revenue water from 25% to 15%.
