id: human_freshwater_supply_infrastructure
name: Freshwater Supply Infrastructure
basin: danube
type: human
service_category: provisioning
teeb_class: provisioning
description: >
  The engineered supply chain that extracts, treats, and distributes water
  to ~81 million people across the Danube Basin. This is the human system
  that takes the natural freshwater asset (paired with
  natural_freshwater_availability) and delivers it as a reliable treated
  water supply through intake structures, treatment plants, pressurized
  networks, and consumer metering.
paired_with:
  natural: natural_freshwater_availability
data_availability: H
primary_sources:
  - name: "WHO/UNICEF Joint Monitoring Programme (JMP)"
    url: "https://washdata.org"
    metrics: "drinking water access by country, service level"
  - name: "AQUASTAT (FAO)"
    url: "https://www.fao.org/aquastat"
    metrics: "water withdrawal by sector and country"
  - name: "Eurostat Water Statistics"
    url: "https://ec.europa.eu/eurostat/statistics-explained/index.php/Water_statistics"
    metrics: "EU member state water abstraction and distribution"
  - name: "EU Water Framework Directive reporting"
    url: "https://water.europa.eu"
    metrics: "water body status, abstractions, pressures"
key_metrics:
  population_with_safely_managed_drinking_water_pct: 88
  urban_access_pct: 97
  rural_access_pct: 76
  annual_abstraction_km3: 35
  treatment_capacity_note: "varies by country; EU members under WFD compliance"
  non_revenue_water_pct_approx: 25
supply_chain_nodes:
  - node: river_groundwater_intake
    description: Abstraction points on Danube, tributaries, or floodplain aquifers
    transparency: high
  - node: raw_water_conveyance
    description: Pumping and pipeline transport from intake to treatment facility
    transparency: high
  - node: water_treatment
    description: Coagulation, filtration, disinfection to WHO/EU drinking water standards
    transparency: high
  - node: pressurized_distribution_network
    description: Pressurized mains, storage reservoirs, pumping stations to consumer points
    transparency: medium
  - node: consumer_delivery_and_metering
    description: Final delivery to residential, commercial, and industrial consumers
    transparency: high
ndc_colors:
  primary: "#1565c0"
  dark: "#0d47a1"
  light: "#e3f2fd"
created: "2026-04-27"
