id: natural_floodplain_forest_biomass
name: Floodplain Forest Biomass
basin: danube
type: natural
service_category: provisioning
teeb_class: provisioning
description: >
  Danube floodplain forests historically covered approximately 300,000 ha (3,000 km²) along
  the main river and its tributaries. River regulation, flood embankments, and agricultural
  conversion have reduced this to approximately 160,000 ha (47% loss). The remaining forests
  are dominated by white willow (Salix alba), white poplar (Populus alba), black alder (Alnus
  glutinosa), common ash (Fraxinus excelsior), and pedunculate oak (Quercus robur) in the
  hardwood forests farther from the channel. Total carbon stock is approximately 17 million
  tonnes CO2 in standing biomass. The ecological production function cascade runs from
  hydrological connectivity (flood pulse) through soil formation, tree establishment,
  biomass accumulation, and ecosystem service delivery. The primary structural bottleneck is
  Phase 0: the annual flood pulse that delivers sediment and nutrients to the floodplain has
  been reduced by approximately 40% by the Iron Gate dams and tributary embankments,
  suppressing the natural regeneration cycle. This subproject pairs with
  human_floodplain_forestry_operations to form the paired_floodplain_forestry composite.
paired_with:
  human: human_floodplain_forestry_operations
  hub: paired_floodplain_forestry
