id: cocoa_netherlands
name: Cocoa Netherlands — Industrial Processing and Value Hub
type: standalone
service_category: provisioning
teeb_class: provisioning
description: >
  The Netherlands is the world's largest single cocoa processing and re-export node. Amsterdam
  alone grinds approximately 600,000 metric tonnes of cocoa beans per year. Rotterdam and Amsterdam
  combined handle approximately 1.2 million tonnes annually. Unlike the global cocoa_international
  project, which models a 7-phase farm-to-retail chain with data quality M (medium), the Netherlands
  chain operates within a dense regulatory and institutional framework that yields data quality H (high)
  at every phase. Port arrivals are documented by the Port of Rotterdam Authority. ECA (European Cocoa
  Association) grading certificates are standardised. NVWA (Netherlands Food and Consumer Product Safety
  Authority) publishes import inspection data. Major processors (Barry Callebaut, Cargill, ADM) publish
  annual sustainability reports with Netherlands-specific volume data. The Dutch Sustainability Agreement
  on Cocoa (Duurzaamheidsconvenant Cacao, coordinated by IDH) covers approximately 75% of the Dutch
  cocoa market with annual progress reporting. This density of institutional documentation makes the
  Netherlands the most data-rich single node in the global cocoa supply chain.
  A second structural feature distinguishes this project from cocoa_international: the presence of
  IOI Loders Croklaan in Wormerveer, Netherlands, one of the world's largest processors of Cocoa Butter
  Equivalents (CBEs). EU Chocolate Directive 2000/36/EC permits up to 5% of cocoa butter to be replaced
  by CBEs, of which shea stearin is the most commonly used. IOI Loders Croklaan fractionates shea butter
  imported from West Africa (including Burkina Faso, the source for the TrueValue shea project) into shea
  stearin for blending with cocoa butter. This makes the Netherlands the physical convergence point of two
  West African supply chains: cocoa and shea. The TrueValue shea supply chain data (N-D-C values at Phase
  4, Export: D=210, C=165, balance=64.0%) is incorporated as a 5% weighted input at Phase 3 (CBE
  Manufacturing), yielding an analytically grounded composite N-D-C score that accurately represents what
  EU chocolate fat systems actually contain.
  This project models 6 phases: port arrival through domestic retail and EU semi-finished re-export.
  The primary bottleneck is Phase 4 (Dutch Manufacturing, balance 85.1%), where the presence of Tony's
  Chocolonely as a high-integrity benchmark and mass-market CBE-dependent manufacturers creates a D-C
  imbalance driven by retail buyer power and ingredient sourcing complexity. All six phases outperform
  the global cocoa_international Phase 1 bottleneck (76.5%), reflecting the Netherlands' institutional
  and regulatory density.
