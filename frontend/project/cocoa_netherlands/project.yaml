bond_relevance: >
  The Netherlands cocoa project offers two distinct bond structures not available at the global scale.
  First, a Dutch Sustainability Agreement SLB: the existing IDH multi-stakeholder agreement covering 75%
  of the Dutch market provides an institutional anchor for a sustainability-linked bond with child-labor-free
  sourcing share and deforestation-free polygon coverage as KPIs, backed by all major Dutch cocoa buyers.
  Second, an EUDR Compliance Bond: the Netherlands is the primary EU customs clearance point for European
  cocoa, making it the structural node where EUDR due diligence verification must be demonstrated. A bond
  tied to verified deforestation-free volumes entering through Rotterdam/Amsterdam would capture the
  highest-value compliance premium in the European market. Phase 4 (Manufacturing, 85.1%) is the bond
  intervention point: improving transparency at the Tony's Chocolonely model level across the broader
  Dutch manufacturing sector would move this phase from fair to good and improve the system balance above
  the 90% coherent threshold.
