# MkDocs config for project documentation wiki
# Serve locally: mkdocs serve
# Build static site: mkdocs build

site_name: Supply Chain Intelligence Docs
site_description: Gold & shea supply chain phase templates, rules, APIs, and methodology
site_url: https://example.com  # Set or remove when deploying

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

docs_dir: docs
strict: false

nav:
  - Home: index.md
  - Supply chain phase templates:
      - Abstract template & Shea instance: ABSTRACT_SUPPLY_CHAIN_PHASE_TEMPLATE_AND_SHEA_INSTANCE.md
      - Gold instance: ABSTRACT_SUPPLY_CHAIN_PHASE_TEMPLATE_GOLD_INSTANCE.md
  - Rules:
      - Supply chain rules: SUPPLY_CHAIN_RULES.md
      - Value chain rules: VALUE_CHAIN_RULES.md
  - API & frontend:
      - Frontend API: FRONTEND_API.md
      - Frontend visualization strategy: FRONTEND_VISUALIZATION_STRATEGY.md
      - Value chain API: VALUE_CHAIN_API.md
  - Methodology:
      - Water, waste & environment: WATER_WASTE_METHODOLOGY.md
      - N-D-C value calculations: NDC_VALUE_CALCULATIONS.md
  - Sarah integration:
      - Sarah quick reference: SARAH_QUICK_REFERENCE.md
      - Sarah integration analysis: SARAH_INTEGRATION_ANALYSIS.md
      - Sarah integration complete: SARAH_INTEGRATION_COMPLETE.md
      - tv-sarah (requirements): tv-sarah.txt
  - Tholonic framework:
      - Tholonic framework (supply chain): Tholonic_Framework_Supply_Chain_Application.md
      - Tholonic integration: THOLONIC_INTEGRATION.md
