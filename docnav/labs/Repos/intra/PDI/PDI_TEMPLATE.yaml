# ============================================================
# Phase Discovery Instrument (PDI) — AI Completion Template
# Version 1.0
# Project: True Value Analytics — Supply Chain Intelligence
# ============================================================
#
# INSTRUCTIONS FOR AI USE
# -----------------------
# 1. Copy this file and rename it: PDI_<material>_<date>.yaml
#    e.g. PDI_olive_oil_2026-04-21.yaml
# 2. Fill in every field. Do not delete fields.
# 3. Where a value is genuinely unknown, write: UNKNOWN
#    and add a comment on the next line explaining why.
# 4. For boolean fields (true/false), use lowercase true or false only.
# 5. For multi-line text fields (marked with |), write freely across
#    as many lines as needed. Preserve the two-space indent.
# 6. For list fields, add items using the - prefix. Remove unused rows
#    or add new ones as needed.
# 7. process_class must be exactly one of:
#      extractive | aggregative | chemical_thermal |
#      specification | certification | custodial | commercial
# 8. transparency must be exactly one of: high | medium | low
# 9. opacity_reason must be one of:
#      informal_practice | commercial_secrecy |
#      physical_inaccessibility | multiple | n/a
# 10. boundary_score is the sum of flagged criteria from B3/B4/B6/B9/B10/B11.
#     Calculate it yourself; do not leave it as 0 if flags are set.
#
# After completion, this file can be validated against:
#   frontend/docs/PDI/pdi.schema.json  (if present)
# and converted to a supply chain phase instance using the
# Abstract Supply Chain Phase Template.
# ============================================================

pdi:

  # ----------------------------------------------------------
  # Header
  # ----------------------------------------------------------
  material: ""                    # e.g. "gold", "shea butter", "olive oil"
  analyst: "AI"                   # Name or "AI (model)" e.g. "AI (Claude Sonnet 4.6)"
  date_completed: ""              # ISO 8601 e.g. 2026-04-21

  # [NEW FIELD] chain_type distinguishes the direction and nature of this chain.
  # forward    — standard supply chain from origin state to terminal market (default)
  # recycling  — inverse/entropy-reversing chain: dispersed waste → secondary feedstock
  #              re-entering a named primary chain at a specific phase
  # ecosystem  — natural service chain (e.g. Danube delta biodiversity)
  chain_type: "forward"           # forward | recycling | ecosystem

  # [NEW FIELD] Required when chain_type is "recycling".
  # Identifies the primary chain this recycling chain feeds back into,
  # and the phase number(s) where secondary material re-enters.
  # Leave null for forward and ecosystem chains.
  primary_chain_link:
    primary_chain_material: null  # e.g. "gold"
    reentry_phases: []            # list of primary chain phase numbers e.g. [4, 5]
    reentry_notes: ""             # describe the re-entry point and material form
  sources_overview: |
    # List the primary documents / sources provided for this analysis.
    # One source per line. Include title, author/org, date if known.

  # Optional: complete if the chain spans multiple geographies or sites.
  geographic_scope:
    programme_envelope_ha: null   # total area if applicable, or null
    countries: []                 # list of { country, sites[], notes } if multi-country

  # Optional: complete for large-scale programmes with defined budgets and timelines.
  programme_scale:
    total_budget_USD: ""
    implementation_years: null
    notes: ""

  # Optional: complete when a formal financial instrument (bond, fund, credit facility)
  # is embedded in the supply chain as a commercialisation mechanism.
  financial_mechanism:
    instrument_name: ""
    instrument_type: ""           # e.g. "DFI-issued milestone-linked bond"
    notes: ""

  # ----------------------------------------------------------
  # MODULE 1 — Anchor the Chain
  # ----------------------------------------------------------
  # Purpose: establish the two fixed endpoints of the chain and
  # produce a first-pass inventory of physical forms and actors.
  # Complete once, before any event records.
  # ----------------------------------------------------------

  module_1:

    A1_origin_state: |
      # Physical form, location, and condition of the material
      # as it exists BEFORE any human intervention.

    A2_market_state: |
      # Physical form, specification, and condition of the material
      # as it is transferred to the FINAL purchaser or registered
      # for market use.

    A3_origin_unit: ""            # e.g. "tonnes of ore", "kg of raw nuts"
    A4_market_unit: ""            # e.g. "troy ounces", "kg of certified butter"

    A5_unit_changes: null         # true | false
    A5_unit_change_location: |
      # If A5 is true: note where in the chain you believe the
      # unit change occurs. This will be confirmed in Module 2.
      # If A5 is false: leave blank.

    A6_physical_forms:
      # List every distinct physical form the material passes through,
      # from origin to market. Add or remove rows as needed.
      - sequence: 1
        form: ""
        location_in_chain: ""
      - sequence: 2
        form: ""
        location_in_chain: ""
      - sequence: 3
        form: ""
        location_in_chain: ""
      - sequence: 4
        form: ""
        location_in_chain: ""
      - sequence: 5
        form: ""
        location_in_chain: ""

    A7_actor_classes:
      # List every distinct actor class that holds or handles
      # the material at any point. Add or remove rows as needed.
      # teeb_category is optional — use for ecosystem services chains.
      # Values: Provisioning | Regulating | Cultural | Biodiversity | All categories
      - sequence: 1
        actor: ""
        point_in_chain: ""
        teeb_category: ""         # optional; leave blank for conventional commodity chains
        notes: ""
      - sequence: 2
        actor: ""
        point_in_chain: ""
        teeb_category: ""
        notes: ""
      - sequence: 3
        actor: ""
        point_in_chain: ""
        teeb_category: ""
        notes: ""
      - sequence: 4
        actor: ""
        point_in_chain: ""
        teeb_category: ""
        notes: ""
      - sequence: 5
        actor: ""
        point_in_chain: ""
        teeb_category: ""
        notes: ""

    module_1_completion_check:
      A1_and_A2_specific_descriptions: null    # true | false
      A3_and_A4_explicit_units: null           # true | false
      A6_at_least_three_forms: null            # true | false
      A7_at_least_three_actors: null           # true | false
      # All four must be true before proceeding to Module 2.

  # ----------------------------------------------------------
  # MODULE 2 — Event Inventory
  # ----------------------------------------------------------
  # Purpose: record every change event in the chain.
  # An event is anything that changes: physical form, custodian,
  # location, process being applied, or legal ownership.
  # Repeat the block below for every event identified.
  # ----------------------------------------------------------

  module_2_events:

    - event_number: 1             # integer, sequential from 1
      event_name: ""              # short descriptive label
      sources: ""                 # sources consulted for this specific event

      B1_form_entering: ""        # physical form of material entering this event
      B2_form_leaving: ""         # physical form of material leaving this event
      B3_physical_state_changes: null   # true | false  (+1 if true)

      B4_unit_changes: null             # true | false  (+1 if true)
      B4_unit_entering: ""
      B4_unit_leaving: ""

      # B5 — process class (choose exactly one):
      #   extractive | aggregative | chemical_thermal |
      #   specification | certification | custodial | commercial
      B5_process_class: ""
      B5_notes: ""                # explain if classification is ambiguous

      B6_process_class_changes: null    # true | false  (+1 if true)
      B6_preceding_process_class: ""    # process class of the immediately preceding event

      B7_custodian_before:
        class: ""                 # actor class
        name: ""                  # specific org or individual, or UNKNOWN
      B8_custodian_after:
        class: ""
        name: ""
      B9_custody_changes: null          # true | false  (+1 if true)

      B10_ownership_changes: null       # true | false | unknown  (+1 if true)
      B10_notes: ""               # explain if unknown

      B11_output_defined: null          # true | false  (+1 if true)
      B11_quantity_and_unit: ""
      B11_approximate_volume: ""        # per year / season / cycle
      B11_recipient: ""                 # actor class or specific entity

      # B12 — only complete if B11 is false:
      #   informal_practice | commercial_secrecy | physical_inaccessibility
      B12_opacity_reason: ""

      # Optional: complete for commercial-phase events with public pricing benchmarks.
      # pricing_reference:
      #   floor_usd_per_unit: null
      #   ceiling_usd_per_unit: null
      #   notes: ""

      # Optional: complete when an event simultaneously produces multiple verified
      # output streams that cannot be reduced to a single child-N unit.
      # multi_value_outputs:
      #   - stream: ""            # e.g. carbon | fisheries | livelihoods | ndc_fulfilment
      #     unit: ""
      #     volume: ""
      #     recipient: ""

      # Boundary score: sum of +1 flags from B3/B4/B6/B9/B10/B11
      # Maximum 6. Calculated by analyst / AI — not auto-computed.
      boundary_score: 0

    # ---- copy this block for each additional event ----
    # - event_number: 2
    #   event_name: ""
    #   ... (all fields as above)

  # ----------------------------------------------------------
  # MODULE 3 — Boundary Scoring and Phase Map
  # ----------------------------------------------------------
  # Purpose: apply interpretation rules to boundary scores and
  # produce the confirmed, numbered phase map.
  #
  # Interpretation rules:
  #   Score 0–1              → sub-process (belongs inside a phase)
  #   Score 2–3, B11=true   → confirmed boundary
  #   Score 2–3, B11=false  → sub-process (no measurable output)
  #   Score 4–6              → confirmed boundary (note if B11=false)
  # ----------------------------------------------------------

  module_3:

    phase_map:
      # Confirmed phases only. Number from 0 (origin/pre-commercial).
      # For recycling chains: phases run in entropy-reducing direction
      # (dispersed waste → secondary feedstock). Number from R0 upward,
      # and set reentry_primary_phase on the final phase.
      - phase: 0
        name: ""
        begins_at_event: null     # event number, or null for phase 0 (origin)
        ends_at_event: null       # event number of the transition to next phase
        child_n_output: ""        # measurable output that leaves this phase (from B11)
        tvpci_notes: ""           # optional: TVPCI / TVPCI-R integration notes
        reentry_primary_phase: null  # [NEW FIELD] recycling chains only: primary chain
                                     # phase number(s) this output re-enters, e.g. [4, 5].
                                     # null for forward/ecosystem chains.
      - phase: 1
        name: ""
        begins_at_event: null
        ends_at_event: null
        child_n_output: ""
        reentry_primary_phase: null
      - phase: 2
        name: ""
        begins_at_event: null
        ends_at_event: null
        child_n_output: ""
        reentry_primary_phase: null
      - phase: 3
        name: ""
        begins_at_event: null
        ends_at_event: null
        child_n_output: ""
        reentry_primary_phase: null
      - phase: 4
        name: ""
        begins_at_event: null
        ends_at_event: null
        child_n_output: ""
        reentry_primary_phase: null
      - phase: 5
        name: ""
        begins_at_event: null
        ends_at_event: null
        child_n_output: ""
        reentry_primary_phase: null
      - phase: 6
        name: ""
        begins_at_event: null
        ends_at_event: null
        child_n_output: ""
        reentry_primary_phase: null
      # Add or remove phases as needed.
      # Most chains resolve to 6–9 phases.
      # Fewer than 5: events may have been grouped prematurely.
      # More than 10: sub-processes may have been elevated to phase status.
      # Note: Phase 8 is not a valid phase in this project's phase map.
      # Recycling is modeled as a separate recycling-chain PDI (chain_type: recycling),
      # not as an extension of the forward chain.

    subprocesses:
      # Events scored as sub-processes, with their assigned phase.
      - event_number: null
        event_name: ""
        belongs_to_phase: null
        reason: ""                # why this did not reach boundary status

  # ----------------------------------------------------------
  # MODULE 4 — Opacity Tagging
  # ----------------------------------------------------------
  # Purpose: assign a transparency classification to each
  # confirmed phase based on four measurability tests.
  # Complete one opacity record per confirmed phase.
  # ----------------------------------------------------------

  module_4_opacity:

    - phase: 0
      phase_name: ""

      C1_volume_measurable: null        # true | false
      C1_source: ""                     # public source, or reason if false

      C2_custodians_public: null        # true | false
      C2_source: ""

      C3_process_verifiable: null       # true | false
      C3_mechanism: ""                  # how it can be verified, or reason if false

      C4_output_confirmable: null       # true | false
      C4_mechanism: ""

      # [NEW FIELD] C5 applies to recycling chains only (chain_type: recycling).
      # For forward and ecosystem chains, leave as null.
      # true  = the point at which secondary material re-enters the primary chain
      #         (reentry_primary_phase) is documented with a traceable record.
      # false = re-entry is undocumented or informally handled.
      C5_reentry_documented: null       # true | false | null (non-recycling chains)
      C5_reentry_source: ""             # source or mechanism confirming re-entry, if true

      # opacity_score: count of true answers above.
      # For forward/ecosystem chains: sum of C1–C4 (max 4).
      # For recycling chains: sum of C1–C5 (max 5); transparency bands shift by +1.
      opacity_score: 0

      # transparency for forward/ecosystem chains: high (4) | medium (2–3) | low (0–1)
      # transparency for recycling chains:         high (5) | medium (3–4) | low (0–2)
      transparency: ""

      # opacity_reason (if medium or low):
      #   informal_practice | commercial_secrecy |
      #   physical_inaccessibility | multiple | n/a
      opacity_reason: ""
      opacity_notes: ""             # expand on multiple factors or unusual situations

    # ---- copy this block for each additional phase ----
    # - phase: 1
    #   phase_name: ""
    #   ...

  # ----------------------------------------------------------
  # SUMMARY — Completed Phase Map
  # ----------------------------------------------------------
  # Fill this in after all four modules are complete.
  # This is the primary deliverable of the instrument.
  # ----------------------------------------------------------

  summary:

    total_phases: 0
    high_transparency_phases: []      # list of phase numbers e.g. [0, 2, 5]
    medium_transparency_phases: []
    low_transparency_phases: []
    subprocesses_identified: 0
    undefined_outputs_count: 0        # events where B11 could not be defined

    phase_summary_table:
      # One row per confirmed phase.
      - phase: 0
        name: ""
        physical_state_in: ""
        physical_state_out: ""
        child_n_output: ""
        custodian_class: ""
        transparency: ""              # high | medium | low

    analyst_notes: |
      # Record anomalies, contradictions between sources,
      # events that could not be confidently classified,
      # or areas requiring further research.

# ============================================================
